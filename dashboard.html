<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>donmitx — Social Hub</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💠</text></svg>">
</head>

<body class="dashboard-body">

    <!-- Auth Guard (Hidden until loaded) -->
    <div id="auth-loading" class="auth-loading">
        <div class="loader"></div>
    </div>

    <!-- Background Effects -->
    <canvas id="particle-canvas" class="subtle"></canvas>
    <div class="gradient-mesh subtle"></div>

    <!-- Top Navigation Bar -->
    <header class="topbar glass" id="topbar">
        <div class="topbar-left">
            <a href="/" class="topbar-brand">
                <span class="gradient-text">don</span><span class="gradient-text-accent">mitx</span>
            </a>

            <!-- Main Navigation Tabs -->
            <nav class="main-nav">
                <button class="nav-tab active" data-tab="library">My Library</button>
                <button class="nav-tab" data-tab="feed">Global Feed</button>
                <button class="nav-tab" data-tab="social">Social</button>
            </nav>
        </div>

        <div class="topbar-right">
            <button class="btn-primary btn-sm" id="btn-new-content">+ New</button>

            <div class="user-info" id="user-info">
                <img class="user-avatar" id="user-avatar" src="" alt="avatar" />
                <span class="user-name" id="user-name"></span>
            </div>

            <button class="btn-icon" id="btn-settings" title="Settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="dashboard-main">

        <!-- View: Library (Folders) -->
        <section id="view-library" class="view-section active">
            <div class="section-header">
                <h2>My Folders</h2>
                <div class="view-controls">
                    <!-- Specific controls for library -->
                </div>
            </div>
            <div class="folder-grid" id="folder-grid">
                <!-- Folders injected here -->
            </div>

            <!-- Items Area (When a folder is selected) -->
            <div id="folder-items-container" class="hidden">
                <div class="folder-breadcrumb">
                    <button class="btn-text" id="btn-back-folders">← Back to Folders</button>
                    <span class="separator">/</span>
                    <span id="current-folder-title">Folder Name</span>
                    <button class="btn-primary btn-xs" id="btn-add-item-to-folder">+ Add Link</button>
                </div>
                <div class="items-grid" id="items-grid">
                    <!-- Items injected here -->
                </div>
            </div>
        </section>

        <!-- View: Feed -->
        <section id="view-feed" class="view-section hidden">
            <div class="section-header">
                <h2>Discover</h2>
                <p>Trending content from the community</p>
            </div>
            <div class="feed-grid" id="feed-grid">
                <!-- Global items -->
            </div>
        </section>

        <!-- View: Social -->
        <section id="view-social" class="view-section hidden">
            <div class="social-layout">
                <aside class="friends-sidebar">
                    <h3>Friends</h3>
                    <div class="friend-search">
                        <input type="text" id="user-search-input" placeholder="Find users...">
                    </div>
                    <ul class="friend-list" id="friend-list">
                        <!-- Friend items -->
                    </ul>
                    <div class="requests-area" id="requests-area">
                        <!-- Pending requests -->
                    </div>
                </aside>
                <div class="chat-area empty" id="chat-area">
                    <div class="empty-state">Select a friend to start chatting</div>
                </div>
            </div>
        </section>

    </main>

    <!-- Modal: New Content (Selector) -->
    <div class="modal-backdrop" id="modal-new-content">
        <div class="modal glass">
            <div class="modal-header">
                <h2>Create New</h2>
                <button class="btn-close" data-close="modal-new-content">×</button>
            </div>
            <div class="modal-body">
                <div class="creation-options">
                    <button class="creation-card" id="opt-new-folder">
                        <span class="icon">📁</span>
                        <h3>New Folder</h3>
                        <p>Organize your links</p>
                    </button>
                    <button class="creation-card" id="opt-new-link">
                        <span class="icon">🔗</span>
                        <h3>New Link</h3>
                        <p>Share a URL</p>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Create Folder -->
    <div class="modal-backdrop" id="modal-create-folder">
        <div class="modal glass">
            <div class="modal-header">
                <h2>New Folder</h2>
                <button class="btn-close" data-close="modal-create-folder">×</button>
            </div>
            <div class="modal-body">
                <form id="form-create-folder">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" name="title" required placeholder="e.g. AI Research">
                    </div>
                    <div class="form-group">
                        <label>Preview Color</label>
                        <div class="color-picker-row">
                            <!-- Simple radio buttons for gradients -->
                            <label class="color-opt"
                                style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%)">
                                <input type="radio" name="color"
                                    value="linear-gradient(135deg, #667eea 0%, #764ba2 100%)" checked>
                            </label>
                            <label class="color-opt"
                                style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%)">
                                <input type="radio" name="color"
                                    value="linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%)">
                            </label>
                            <label class="color-opt"
                                style="background: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%)">
                                <input type="radio" name="color"
                                    value="linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%)">
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Privacy</label>
                        <select name="privacy">
                            <option value="private">Private (Only Me)</option>
                            <option value="public">Public (Everyone)</option>
                            <option value="friends">Friends Only</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary full-width">Create Folder</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: Add Item -->
    <div class="modal-backdrop" id="modal-add-item">
        <div class="modal glass">
            <div class="modal-header">
                <h2>Add Link</h2>
                <button class="btn-close" data-close="modal-add-item">×</button>
            </div>
            <div class="modal-body">
                <form id="form-add-item">
                    <div class="form-group">
                        <label>URL</label>
                        <input type="url" name="url" id="inp-item-url" required placeholder="https://...">
                    </div>

                    <div id="url-preview-area" class="hidden">
                        <div class="preview-card glass-panel">
                            <img id="preview-img" src="" class="hidden">
                            <h4 id="preview-title">...</h4>
                            <span id="preview-type" class="badge">Link</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Folder</label>
                        <select name="folderId" id="inp-item-folder" required>
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                    <button type="submit" class="btn-primary full-width" id="btn-save-item">Save Link</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: Settings/Logout -->
    <div class="modal-backdrop" id="modal-settings">
        <div class="modal glass">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="btn-close" data-close="modal-settings">×</button>
            </div>
            <div class="modal-body">
                <div class="settings-group">
                    <h3>Account</h3>
                    <p id="settings-email"></p>
                    <div class="firebase-status-row">
                        <span>Connection Status:</span>
                        <span id="db-status-indicator" class="status-badge success">Online</span>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btn-test-connection">Test DB Connection</button>
                    <button class="btn-danger" id="btn-logout">Sign Out</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="src/dashboard-main.js"></script>
</body>

</html>
