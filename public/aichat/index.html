<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uros de Rivas — AI Agent Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gradient-text {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col p-4 md:p-8">

    <header class="max-w-4xl w-full mx-auto mb-8 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">
                <span class="gradient-text">Uros</span><span>AI</span>
            </h1>
            <p class="text-slate-400 text-sm">Basketball Intelligence Swarm</p>
        </div>
        <div id="status-badge"
            class="px-3 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20">
            Offline
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto flex-grow flex flex-col glass rounded-2xl overflow-hidden shadow-2xl">
        <!-- Chat History -->
        <div id="chat-history" class="flex-grow p-6 overflow-y-auto space-y-4">
            <div class="flex justify-start">
                <div class="max-w-[80%] p-3 rounded-2xl bg-slate-800 border border-slate-700 text-sm">
                    Hello! I am the Uros de Rivas AI Assistant. I can help you with basketball management, data
                    translation, or team strategy. How can I assist you today?
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-slate-900/50 border-t border-slate-700">
            <form id="chat-form" class="flex gap-2">
                <input type="text" id="user-input" autocomplete="off"
                    class="flex-grow bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all"
                    placeholder="Type your message here...">
                <button type="submit"
                    class="bg-sky-600 hover:bg-sky-500 text-white px-6 py-2 rounded-xl text-sm font-semibold transition-colors shadow-lg shadow-sky-900/20">
                    Send
                </button>
            </form>
            <div class="mt-2 flex justify-between items-center text-[10px] text-slate-500 px-1">
                <span>Model: Qwen 2.5 Coder 14B</span>
                <span id="latency">Latency: -- ms</span>
            </div>
        </div>
    </main>

    <script>
        // CONFIGURATION
        // Replace this with your Cloudflare Tunnel URL or GCP IP
        const OLLAMA_URL = "http://34.155.103.125:11434";
        const MODEL = "qwen2.5-coder:14b";

        const chatHistory = document.getElementById('chat-history');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const statusBadge = document.getElementById('status-badge');
        const latencyDisplay = document.getElementById('latency');

        // Check Connection
        async function checkStatus() {
            try {
                const res = await fetch(`${OLLAMA_URL}/api/tags`);
                if (res.ok) {
                    statusBadge.innerText = "Online";
                    statusBadge.className = "px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                }
            } catch (e) {
                console.error("Connection failed", e);
            }
        }
        checkStatus();

        function addMessage(text, isUser = false) {
            const div = document.createElement('div');
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div class="max-w-[80%] p-3 rounded-2xl ${isUser ? 'bg-sky-600 text-white' : 'bg-slate-800 border border-slate-700'} text-sm shadow-md">
                    ${text}
                </div>
            `;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            userInput.value = '';

            const start = Date.now();
            try {
                const response = await fetch(`${OLLAMA_URL}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [{ role: 'user', content: text }],
                        stream: false
                    })
                });

                const data = await response.json();
                const reply = data.choices[0].message.content;
                const end = Date.now();

                addMessage(reply, false);
                latencyDisplay.innerText = `Latency: ${end - start} ms`;
            } catch (err) {
                addMessage("⚠️ Error: Could not connect to the model. Ensure the Cloudflare Tunnel is running.", false);
            }
        });
    </script>
</body>

</html>
