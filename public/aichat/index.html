<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Live Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e1a;
            --card: rgba(20, 25, 41, 0.7);
            --card-hover: #1c2238;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.15);
            --error: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.15);
            --text: #f1f5f9;
            --text-muted: #64748b;
            --gold: #f59e0b;
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: transparent;
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 10px;
            align-items: center;
        }

        .game-wrapper {
            width: 100%;
            max-width: 800px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
            padding-top: 10px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            backdrop-filter: blur(10px);
        }

        .animate-in {
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin: 40px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-host {
            background: linear-gradient(135deg, var(--primary), #a855f7);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            margin-top: 20px;
            width: 100%;
        }

        .btn-host:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .btn-host:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Chat Interface */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(20, 25, 41, 0.85);
            border-radius: var(--radius);
        }

        .chat-topbar {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(10, 14, 26, 0.5);
            flex-shrink: 0;
        }

        .chat-topbar h2 {
            font-size: 1.1rem;
            margin: 0;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .status-checking {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .status-online {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-offline {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .spectator-badge {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .mode-badge {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.25);
            font-size: 0.7rem;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        .message.user,
        .message.host,
        .message.participant {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.ai {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message.system {
            align-self: center;
            align-items: center;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, var(--primary), #818cf8);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.host .bubble {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.participant .bubble {
            background: linear-gradient(135deg, #0d9488, #14b8a6);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .message.system .bubble {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.15);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
        }

        .message-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
            padding: 0 4px;
        }

        .message-author {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .input-area {
            padding: 16px;
            background: rgba(10, 14, 26, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }

        .chat-form {
            display: flex;
            gap: 12px;
        }

        .user-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            height: 52px;
            transition: border-color 0.2s;
            outline: none;
        }

        .user-input:focus {
            border-color: var(--primary);
        }

        .user-input::placeholder {
            color: var(--text-muted);
        }

        .btn-send {
            background: linear-gradient(135deg, var(--primary), #a855f7);
            color: white;
            border: none;
            border-radius: 12px;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .btn-send:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-send svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            margin-bottom: 16px;
            display: none;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .player-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
            text-align: left;
        }

        .player-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .player-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        .player-name {
            font-size: 0.9rem;
            font-weight: 600;
            flex: 1;
        }

        .host-badge {
            font-size: 0.7rem;
            background: var(--gold);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        .spectator-blocker {
            text-align: center;
            padding: 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-style: italic;
        }

        /* Game Mode Selector */
        .mode-selector {
            margin-top: 16px;
            text-align: left;
        }

        .mode-cards {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .mode-card {
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            background: rgba(99, 102, 241, 0.05);
        }

        .mode-card.selected {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.2);
        }

        .mode-card h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .mode-card p {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Results Overlay */
        .results-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.4s ease;
        }

        .results-card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .results-card h2 {
            font-size: 1.8rem;
            margin-bottom: 24px;
            background: linear-gradient(135deg, var(--gold), #fbbf24);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .podium {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .podium-item {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            min-width: 80px;
        }

        .podium-rank {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .podium-name {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .podium-score {
            font-size: 0.8rem;
            color: var(--gold);
            margin-top: 2px;
        }

        .score-list {
            text-align: left;
            margin-top: 16px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        .score-row:last-child {
            border: none;
        }

        .score-pts {
            color: var(--gold);
            font-weight: 700;
        }

        /* Correct/Wrong flash */
        .flash-correct {
            animation: flashGreen 0.6s ease;
        }

        .flash-wrong {
            animation: flashRed 0.6s ease;
        }

        @keyframes flashGreen {

            0%,
            100% {
                background: inherit;
            }

            50% {
                background: rgba(16, 185, 129, 0.2);
            }
        }

        @keyframes flashRed {

            0%,
            100% {
                background: inherit;
            }

            50% {
                background: rgba(239, 68, 68, 0.2);
            }
        }

        .btn-export {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-export:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text);
        }

        .memory-indicator {
            font-size: 0.7rem;
            color: var(--text-muted);
            padding: 4px 10px;
            background: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 8px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 200;
            animation: fadeIn 0.3s ease;
            pointer-events: none;
        }

        /* Memory Overlay */
        .memory-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 150;
            animation: fadeIn 0.3s ease;
        }

        .memory-panel {
            background: var(--card);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .memory-panel h3 {
            margin-bottom: 20px;
            color: #c084fc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .memory-content {
            overflow-y: auto;
            flex: 1;
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text);
            padding-right: 10px;
            white-space: pre-wrap;
        }

        .btn-close-memory {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-close-memory:hover {
            background: rgba(239, 68, 68, 0.5);
        }

        .btn-delete-iter {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-delete-iter:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .iter-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .iter-header {
            display: flex;
            align-items: center;
            font-weight: bold;
            color: #a855f7;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <div class="game-wrapper">
        <div class="header">
            <h1>🤖 AI Chat Room</h1>
            <p class="subtitle" id="room-code">Connecting to room...</p>
        </div>
        <div id="app-area" style="text-align: center; flex: 1; min-height: 0; display: flex; flex-direction: column;">
            <div class="spinner"></div>
        </div>
    </div>
    <div id="results-overlay" class="results-overlay" style="display:none;"></div>

    <script>
        // --- CONFIGURATION ---
        let OLLAMA_URL = (localStorage.getItem('donmitx_ollama_url') || "https://api.donmitx.com").replace(/\/$/, '');
        let MODEL = localStorage.getItem('donmitx_ollama_model') || "qwen2.5-coder:14b";

        // Access Firebase via parent window (Dashboard)
        if (!window.parent.DONMITX_GAME_API) {
            document.getElementById('app-area').innerHTML = '<p style="color:var(--error); margin-top:20px;">Error: Must be played from Dashboard.</p>';
            throw new Error("Game API missing");
        }
        const { db, auth, doc, onSnapshot, updateDoc: _updateDoc, collection, addDoc, getDocs, query, orderBy, limit } = window.parent.DONMITX_GAME_API;

        const updateDoc = async (ref, data) => {
            const pureData = window.parent.JSON.parse(JSON.stringify(data));
            return _updateDoc(ref, pureData);
        };

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');

        if (!roomId) {
            document.getElementById('app-area').innerHTML = '<p style="color:var(--error); margin-top:20px;">Error: No Room ID provided.</p>';
            throw new Error("No roomId");
        }

        let currentUser = null;
        let roomRef = doc(db, 'game_rooms', roomId);
        let roomState = null;

        // Chat state
        let messagesUnsubscribe = null;
        let isOnline = false;
        let isGenerating = false;
        let localMessageContext = [];
        let displayedMessageIds = new Set();
        let streamingBubble = null;
        let streamingBubbleMsgDiv = null; // outer .message div for finalization
        let isStreaming = false; // true while actively streaming tokens
        let gameModeStarted = false; // prevent double-start
        let currentRenderedStatus = null; // guard against double-render for same status
        let currentRenderedMode = null;   // guard against double-render for same mode
        let pendingAiContent = null; // tracks content already displayed by streaming bubble
        let pendingBubbleMsgDiv = null; // the outer .message div kept alive after streaming
        let playingRendered = false; // true after the playing UI has been built once
        let humanMessageQueue = []; // queued human messages for consciousness loop

        // Consciousness memory system
        let consciousnessMemory = {
            iteration: 0,
            runningSummary: '',       // Compressed memory of all past thoughts
            confidence: 'medium',     // Self-assessed confidence
            keyInsights: [],          // Important ideas extracted
            hostMessages: [],         // Host messages (highest priority)
            userMessages: [],         // Non-host user messages
            recentAiOutputs: [],      // Last few AI outputs (uncompressed)
            mistakes: [],             // Self-identified mistakes
        };

        // Game mode state
        let selectedGameMode = 'free_chat';
        let recursionTimer = null;
        let questionTimer = null;
        let currentCorrectAnswer = null;
        let questionActive = false;
        let questionNumber = 0;

        // Elements
        let chatHistory = null;
        let userInput = null;
        let btnSend = null;
        let typingIndicator = null;

        const GAME_MODES = {
            free_chat: { name: '💬 Free Chat', desc: 'Open conversation with the AI. All participants can send messages.' },
            consciousness: { name: '🧠 Create Consciousness', desc: 'Recursive AI loop. The model calls itself continuously, compressing context. Memory persists in Firebase — any participant can drive the loop.' },
            questioner: { name: '❓ The Questioner', desc: 'Trivia game! AI asks questions, players answer for points. Host can end the game.' }
        };

        // Fallback runner for consciousness loop (if host leaves, participants keep it alive)
        // Enhanced: also checks state.loopAlive flag — loop continues unless self-killed
        setInterval(() => {
            if (roomState?.status === 'playing' && getGameMode() === 'consciousness' && isParticipant()) {
                const loopAlive = roomState.state?.loopAlive !== false; // default true
                if (!loopAlive) return; // self-killed, don't revive
                const lastUpdate = roomState.state?.lastConsciousnessUpdate || 0;
                const isTyping = roomState.state?.isAiTyping || false;
                // If no one updated it in the last 20 seconds and it's not currently generating
                if (!isGenerating && !isTyping && Date.now() - lastUpdate > 20000) {
                    console.log("[aichat] Fallback runner taking over consciousness loop...");
                    startConsciousnessLoop();
                }
            }
        }, 5000);

        // Listen for Auth State
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                initRoom();
            } else {
                document.getElementById('app-area').innerHTML = '<p style="color:var(--error); margin-top:20px;">You must be logged in to participate.</p>';
            }
        });

        function initRoom() {
            document.getElementById('room-code').textContent = `Room ID: ${roomId.substring(0, 6).toUpperCase()}`;

            onSnapshot(roomRef, (snapshot) => {
                if (!snapshot.exists()) {
                    document.getElementById('app-area').innerHTML = '<p style="margin-top:20px;">Room has been closed by the host.</p>';
                    return;
                }

                roomState = snapshot.data();
                const newMode = roomState.state?.gameMode || 'free_chat';

                // Helper to sync live text to spectator's DOM
                const syncSpectatorLiveStream = (state) => {
                    if (isHost()) return;
                    if (state?.isAiTyping && state?.currentAiStream) {
                        if (!streamingBubble) {
                            const { bubble, wrapper } = createLocalStreamingBubble('...');
                            const authorEl = document.createElement('div');
                            authorEl.className = 'message-author';
                            authorEl.textContent = `🤖 Consciousness`;
                            wrapper.insertBefore(authorEl, bubble);
                            streamingBubble = bubble;
                            streamingBubbleMsgDiv = wrapper;
                        }
                        streamingBubble.textContent = state.currentAiStream;
                        scrollToBottom();
                    } else if (!state?.isAiTyping && streamingBubbleMsgDiv) {
                        if (chatHistory && streamingBubbleMsgDiv.parentNode === chatHistory) {
                            chatHistory.removeChild(streamingBubbleMsgDiv);
                        }
                        streamingBubble = null;
                        streamingBubbleMsgDiv = null;
                    }
                };

                // If we are already in playing state with the same mode, do NOT re-render.
                // Just silently update consciousnessMemory from Firebase so the next loop iteration uses it.
                if (playingRendered && roomState.status === 'playing' && currentRenderedMode === newMode) {
                    // 1) Model Sync: Ensure ALL users sync with the live room model
                    if (roomState.state?.model) {
                        MODEL = roomState.state.model;
                    }

                    // Sync memory from Firebase into local var (the round-trip)
                    if (roomState.state?.consciousnessMemory) {
                        consciousnessMemory = roomState.state.consciousnessMemory;
                    }
                    // Update UI elements that depend on snapshot
                    const memInd = document.getElementById('memory-indicator');
                    if (memInd) memInd.textContent = `🧠 Iter #${consciousnessMemory.iteration} · ${consciousnessMemory.confidence || 'medium'}`;
                    if (!isHost()) {
                        updateSpectatorTypingState(roomState.state?.isAiTyping);
                        syncSpectatorLiveStream(roomState.state);
                    }
                    return;
                }

                // Full re-render on actual status/mode transitions
                if (currentRenderedStatus !== roomState.status || currentRenderedMode !== newMode) {
                    // Update model before render so UI reflects it
                    if (roomState.state?.model) {
                        MODEL = roomState.state.model;
                    }
                    currentRenderedStatus = roomState.status;
                    currentRenderedMode = newMode;
                    playingRendered = false; // reset so render() builds the UI
                    render();
                }

                if (roomState.status === 'playing') {
                    if (isHost()) {
                        updateHostOllamaBadge();
                    } else {
                        updateSpectatorTypingState(roomState.state?.isAiTyping);
                        syncSpectatorLiveStream(roomState.state);
                    }
                }
            });
        }

            const area = document.getElementById('app-area');
            // Clear timers on re-render
            clearTimeout(recursionTimer);
            clearTimeout(questionTimer);

            if (roomState.status === 'lobby') {
                // Reset playing-state flags when returning to lobby
                gameModeStarted = false;
                displayedMessageIds.clear();
                localMessageContext = [];
                humanMessageQueue = [];
                pendingAiContent = null;
                pendingBubbleMsgDiv = null;
                area.innerHTML = renderLobby();
                if (isHost()) setupLobbyControls();
            } else if (roomState.status === 'playing') {
                // Reset displayed messages and DOM since we're rebuilding the playing UI
                humanMessageQueue = [];
                pendingAiContent = null;
                pendingBubbleMsgDiv = null;
                streamingBubble = null;
                streamingBubbleMsgDiv = null;
                isGenerating = false;
                isStreaming = false;
                gameModeStarted = false;

                if (roomState?.status === 'playing' && !playingRendered) {
                    // BUGFIX: Clear DOM tracking arrays so historical messages from Firebase inject properly on render
                    displayedMessageIds.clear();
                    localMessageContext = [];
                }

                // Restore consciousness memory from Firestore if available
                if (roomState?.state?.consciousnessMemory) {
                    consciousnessMemory = roomState.state.consciousnessMemory;
                } else {
                    consciousnessMemory = {
                        iteration: 0,
                        runningSummary: '',
                        confidence: 'medium',
                        keyInsights: [],
                        hostMessages: [],
                        userMessages: [],
                        recentAiOutputs: [],
                        mistakes: [],
                    };
                }

                area.innerHTML = renderPlaying();
                setupChatControls();
                subscribeToMessages();
                playingRendered = true; // Mark playing UI as built
                if (isHost()) {
                    checkOllamaStatus(); // will trigger startGameModeLogic on first connect
                } else {
                    // Non-host: also start the fallback watcher if consciousness mode
                    if (getGameMode() === 'consciousness') {
                        // The setInterval fallback at line 834 handles this
                    }
                    updateSpectatorTypingState(roomState.state?.isAiTyping);
                }
            } else if (roomState.status === 'finished') {
                showResults();
            }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        async function fetchAvailableModels() {
            const select = document.getElementById('host-model-select');
            const status = document.getElementById('model-load-status');
            if (!select) return;
            select.innerHTML = '<option value="" disabled selected>Loading models...</option>';
            if (status) status.textContent = 'Connecting to ' + OLLAMA_URL + '...';
            try {
                const res = await fetch(`${OLLAMA_URL}/api/tags`);
                if (!res.ok) throw new Error('API returned ' + res.status);
                const data = await res.json();
                const models = (data.models || []).map(m => m.name).sort();
                select.innerHTML = '';
                if (models.length === 0) { select.innerHTML = '<option value="" disabled>No models found</option>'; if (status) status.textContent = '⚠️ No models installed.'; return; }
                models.forEach(name => { const opt = document.createElement('option'); opt.value = name; opt.textContent = name; if (name === MODEL) opt.selected = true; select.appendChild(opt); });
                if (!models.includes(MODEL)) select.selectedIndex = 0;
                if (status) status.textContent = `✅ ${models.length} model${models.length > 1 ? 's' : ''} available`;
            } catch (err) {
                console.error('Failed to fetch models:', err);
                select.innerHTML = `<option value="${escapeHTML(MODEL)}" selected>${escapeHTML(MODEL)} (cached)</option>`;
                if (status) status.textContent = `❌ Error: ${err.message || 'Connection failed'}.`;
            }
        }

            if (isOnline) {
                badge.innerText = "Online";
                badge.className = "badge status-online";
                if (btnSend && !isGenerating && isHost()) btnSend.disabled = userInput.value.trim() === '';
            } else {
                badge.innerText = "Offline";
                badge.className = "badge status-offline";
                const latEl = document.getElementById('latency');
                if (latEl) latEl.innerText = "";
                if (btnSend && isHost()) btnSend.disabled = true;
            }
        }

        function checkOllamaStatus() {
            if (window.location.protocol === 'https:' && OLLAMA_URL.startsWith('http://')) {
                isOnline = false;
                const badge = document.getElementById('status-badge');
                if (badge) { badge.innerText = "Mixed Content Blocked"; badge.className = "badge status-offline"; }
                const area = document.getElementById('chat-history');
                if (area && !area.querySelector('.mixed-content-warning')) {
                    area.insertAdjacentHTML('beforeend', `<div class="message ai mixed-content-warning"><div class="bubble" style="background: rgba(239,68,68,0.15); border: 1px solid #ef4444; color: #f87171;"><strong>Connection Blocked:</strong> HTTPS site cannot connect to HTTP Ollama (${OLLAMA_URL}). Use an HTTPS tunnel (e.g., ngrok).</div></div>`);
                }
                if (btnSend && isHost()) btnSend.disabled = true;
                return;
            }
            const start = performance.now();
            fetch(`${OLLAMA_URL}/api/tags`)
                .then(res => {
                    if (res.ok) {
                        const wasOffline = !isOnline;
                        isOnline = true;
                        const latEl = document.getElementById('latency');
                        if (latEl) latEl.innerText = `${Math.round(performance.now() - start)}ms`;
                        updateHostOllamaBadge();
                        // Trigger game mode on first successful connect
                        if (wasOffline && !gameModeStarted && getGameMode() !== 'free_chat') {
                            gameModeStarted = true;
                            console.log('[aichat] Ollama online, starting game mode:', getGameMode());
                            setTimeout(() => startGameModeLogic(), 500);
                        }
                    } else { isOnline = false; updateHostOllamaBadge(); }
                })
                .catch(() => { isOnline = false; updateHostOllamaBadge(); })
                .finally(() => { if (roomState?.status === 'playing') setTimeout(checkOllamaStatus, 10000); });
        }

        function updateSpectatorTypingState(isTyping) {
            if (isHost() || !typingIndicator) return;
            typingIndicator.classList.toggle('active', !!isTyping);
            if (isTyping) scrollToBottom();
        }

        function scrollToBottom() { if (chatHistory) chatHistory.scrollTop = chatHistory.scrollHeight; }

        // --- FIREBASE SYNC ---
        function subscribeToMessages() {
            if (messagesUnsubscribe) messagesUnsubscribe();
            const msgsRef = collection(db, 'game_rooms', roomId, 'messages');
            const q = query(msgsRef, orderBy('timestamp', 'asc'));

            messagesUnsubscribe = onSnapshot(q, (snapshot) => {
                let messagesAdded = false;
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added') {
                        const data = change.doc.data();
                        const id = change.doc.id;
                        if (!displayedMessageIds.has(id)) {
                            displayedMessageIds.add(id);
                            // Skip if this doc is already rendered as a finalized streaming bubble
                            // Match by content similarity since we don't have the doc ID during streaming
                            if (pendingBubbleMsgDiv && pendingAiContent && data.content && data.content === pendingAiContent) {
                                pendingBubbleMsgDiv.dataset.msgId = id;
                                pendingBubbleMsgDiv = null;
                                pendingAiContent = null;
                                return;
                            }
                            const isMsgHost = data.authorUid === roomState?.hostUid;
                            localMessageContext.push({ role: data.role === 'user' ? 'user' : 'assistant', content: data.content, isHost: isMsgHost, authorName: data.authorName });
                            appendStaticMessage(data.role, data.content, data.authorName, data.timestamp, id, data.authorUid);
                            messagesAdded = true;
                        }
                    }
                });
                if (messagesAdded) scrollToBottom();
            }, (error) => {
                console.error('[aichat] Messages subscription error:', error);
                if (chatHistory) {
                    chatHistory.insertAdjacentHTML('beforeend', '<div class="message system"><div class="bubble" style="color: var(--error);">⚠️ Failed to load messages. Check Firestore rules.</div></div>');
                }
            });
        }

        function formatTime(isoString) { const d = new Date(isoString); return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

        function appendStaticMessage(role, content, authorName, timestampIso, firestoreId, authorUid) {
            // If we have a finalized streaming bubble in the DOM for this exact Firestore doc, just update its ID dataset and return (prevent duplicate)
            if (firestoreId && pendingBubbleMsgDiv && pendingBubbleMsgDiv.dataset.msgId === firestoreId) {
                return; // we already rendered this in-place via streaming
            }

            // Don't append while streaming is active for AI messages
            if (streamingBubble && role === 'ai' && isStreaming) {
                return;
            }

            let formattedContent = escapeHTML(content);
            formattedContent = formattedContent.replace(/```([\s\S]*?)```/g, '<pre style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; overflow-x: auto;"><code>$1</code></pre>');
            formattedContent = formattedContent.replace(/\n/g, '<br/>');

            // Distinguish host vs participant vs AI vs system bubbles
            let cssClass;
            if (role === 'system') cssClass = 'system';
            else if (role === 'ai') cssClass = 'ai';
            else if (authorUid && authorUid === roomState?.hostUid) cssClass = 'host';
            else if (role === 'user') cssClass = 'participant';
            else cssClass = 'user';
            const nameHtml = authorName ? `<div class="message-author">${escapeHTML(authorName)}</div>` : '';

            const html = `
                <div class="message ${cssClass}" ${firestoreId ? `data-msg-id="${firestoreId}"` : ''}>
                    ${nameHtml}
                    <div class="bubble">${formattedContent}</div>
                    <div class="message-time">${formatTime(timestampIso)}</div>
                </div>
            `;

            // Insert before typing indicator instead of appending at end
            if (typingIndicator && typingIndicator.parentNode === chatHistory) {
                typingIndicator.insertAdjacentHTML('beforebegin', html);
            } else if (chatHistory) {
                chatHistory.insertAdjacentHTML('beforeend', html);
            }
            scrollToBottom();
        }

        function exportChat() {
            let text = `AI Chat Export — ${new Date().toLocaleString()}\nRoom: ${roomId}\nMode: ${getGameMode()}\n${'='.repeat(50)}\n\n`;

            localMessageContext.forEach(msg => {
                const role = msg.role === 'user' ? '👤 Human' : '🤖 AI';
                text += `${role}:\n${msg.content}\n\n---\n\n`;
            });

            if (getGameMode() === 'consciousness' && consciousnessMemory.runningSummary) {
                text += `\n${'='.repeat(50)}\n🧠 CONSCIOUSNESS MEMORY (Iteration #${consciousnessMemory.iteration}):\n${consciousnessMemory.runningSummary}\n`;
                if (consciousnessMemory.keyInsights.length > 0) {
                    text += `\nKey Insights:\n${consciousnessMemory.keyInsights.map((s, i) => `${i + 1}. ${s}`).join('\n')}\n`;
                }
                if (consciousnessMemory.mistakes.length > 0) {
                    text += `\nSelf-Corrections:\n${consciousnessMemory.mistakes.map((s, i) => `${i + 1}. ${s}`).join('\n')}\n`;
                }
            }

            // Copy to clipboard
            navigator.clipboard.writeText(text).then(() => {
                showToast('Chat copied to clipboard!');
            }).catch(() => {
                // Fallback: download as file
                downloadChat(text);
            });
        }

        function downloadChat(text) {
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `aichat_${getGameMode()}_${new Date().toISOString().slice(0, 10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Chat downloaded!');
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // --- UI UTILS ---
        function showMemoryOverlay() {
            let existing = document.getElementById('memory-overlay-container');
            if (existing) existing.remove();

            let contentHtml = '';
            const rawContent = consciousnessMemory.runningSummary || '';

            if (!rawContent) {
                contentHtml = "No permanent memory formed yet. Ask the agent a question to seed its consciousness.";
            } else {
                // Parse iterations by [Iter X] or [Iter X] Auto-summary:
                const iterRegex = /(\[Iter \d+\](?: Auto-summary:|\s*Human Message:)?)/g;
                const parts = rawContent.split(iterRegex);

                if (parts.length <= 1) {
                    contentHtml = `<div class="iter-block">${escapeHTML(rawContent)}</div>`;
                } else {
                    // Reconstruct into blocks
                    for (let i = 1; i < parts.length; i += 2) {
                        const header = parts[i];
                        const body = parts[i + 1] || '';
                        // Extract just the exact string we would want to slice out if deleted
                        const fullBlockRaw = header + body;

                        const renderHeader = escapeHTML(header);
                        const renderBody = escapeHTML(body.trim());

                        // Give hosts a delete button
                        const deleteBtn = isHost() ? `<button class="btn-delete-iter" data-block="${escapeHTML(fullBlockRaw)}">🗑️ Delete</button>` : '';

                        contentHtml += `
                            <div class="iter-block">
                                <div class="iter-header">
                                    ${renderHeader} 
                                    ${deleteBtn}
                                </div>
                                <div class="iter-body">${renderBody}</div>
                            </div>
                        `;
                    }
                }
            }

            const overlay = document.createElement('div');
            overlay.id = 'memory-overlay-container';
            overlay.className = 'memory-overlay';
            overlay.innerHTML = `
                <div class="memory-panel">
                    <h3>🧠 Agent Brain <button class="btn-close-memory" id="btn-close-memory">✕</button></h3>
                    <div class="memory-content">${contentHtml}</div>
                </div>
            `;
            document.body.appendChild(overlay);

            // Bind delete events
            if (isHost()) {
                const deleteBtns = overlay.querySelectorAll('.btn-delete-iter');
                deleteBtns.forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const targetBlockString = unescapeHTML(e.currentTarget.dataset.block);
                        // Cut it out of the running block instantly
                        let newSummary = consciousnessMemory.runningSummary.replace(targetBlockString, '');
                        // Clean up any double newlines left behind
                        newSummary = newSummary.replace(/\n{3,}/g, '\n\n').trim();

                        consciousnessMemory.runningSummary = newSummary;
                        e.currentTarget.closest('.iter-block').remove();

                        // Push immediately to Firebase
                        try {
                            // Update just the exact deep property inside the map
                            await updateDoc(roomRef, {
                                'state.consciousnessMemory.runningSummary': newSummary
                            });
                        } catch (err) {
                            console.error("Failed to delete memory chunk", err);
                        }
                    });
                });
            }

            document.getElementById('btn-close-memory').addEventListener('click', () => {
                overlay.remove();
            });
            // Click outside to close
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.remove();
            });
        }

        // --- MESSAGE SENDING (ALL PARTICIPANTS) ---
        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Check for host "end of game" command in questioner mode
            if (isHost() && getGameMode() === 'questioner' && text.toLowerCase().includes('end of game')) {
                await endGame();
                userInput.value = '';
                return;
            }

            btnSend.disabled = true;
            userInput.value = '';
            userInput.style.height = '52px';

            const userIsoString = new Date().toISOString();
            const isUserHost = isHost();

            try {
                const msgsRef = collection(db, 'game_rooms', roomId, 'messages');
                const docRef = await addDoc(msgsRef, {
                    role: 'user',
                    content: text,
                    authorName: currentUser.displayName || 'User',
                    authorUid: currentUser.uid,
                    timestamp: userIsoString
                });

                // In consciousness mode — queue the human message for the next recursion
                if (getGameMode() === 'consciousness') {
                    humanMessageQueue.push({
                        id: docRef.id,
                        content: text,
                        isHost: isUserHost,
                        authorName: currentUser.displayName || 'User'
                    });

                    // Special handling for "terminate simulation" — write a flag to Firebase state
                    if (text.toLowerCase().trim() === 'terminate simulation' && isUserHost) {
                        try {
                            await updateDoc(roomRef, { 'state.terminationRequested': true });
                        } catch (e) { console.warn('Failed to set termination flag', e); }
                    }

                    // Any participant can trigger fast recursion (not just host)
                    // This ensures non-host messages are picked up promptly
                    if (!isGenerating) {
                        clearTimeout(recursionTimer);
                        recursionTimer = setTimeout(() => startConsciousnessLoop(), 1500);
                    }
                }

                // If this user is the host, trigger AI response for free_chat mode
                if (isHost() && getGameMode() === 'free_chat') {
                    await generateAIResponse(text);
                }

                if (btnSend) btnSend.disabled = isHost() ? (!isOnline || isGenerating || userInput.value.trim() === '') : (userInput.value.trim() === '');
            } catch (err) {
                console.error("Error sending user message:", err);
                btnSend.disabled = false;
            }
        }
        async function generateAIResponse(triggerText) {
            if (!isHost() || !isOnline) { console.warn('[aichat] generateAIResponse skipped: host=', isHost(), 'online=', isOnline); return; }
            isGenerating = true;
            isStreaming = true;
            if (btnSend && isHost()) btnSend.disabled = true;

            try {
                await updateDoc(roomRef, { 'state.isAiTyping': true });
            } catch (e) { console.error('Failed to set typing state', e); }

            if (typingIndicator) typingIndicator.classList.add('active');
            scrollToBottom();

            let fullAiResponse = "";
            try {
                const recentContext = [...localMessageContext];
                if (triggerText && (recentContext.length === 0 || recentContext[recentContext.length - 1].content !== triggerText)) {
                    recentContext.push({ role: 'user', content: triggerText });
                }

                let promptString = "";
                recentContext.slice(-10).forEach(msg => {
                    promptString += `${msg.role === 'user' ? 'Human' : 'Assistant'}: ${msg.content}\n\n`;
                });
                promptString += "Assistant: ";

                const response = await fetch(`${OLLAMA_URL}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: MODEL, prompt: promptString, stream: true })
                });

                if (!response.ok) throw new Error('Network response was not ok');
                if (typingIndicator) typingIndicator.classList.remove('active');

                const { bubble, wrapper } = createLocalStreamingBubble();
                streamingBubble = bubble;
                streamingBubbleMsgDiv = wrapper;
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let lastSyncTime = Date.now();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n').filter(line => line.trim() !== '');
                    for (const line of lines) {
                        try {
                            const data = JSON.parse(line);
                            if (data.response) {
                                fullAiResponse += data.response;
                                if (streamingBubble) streamingBubble.textContent = fullAiResponse;
                                scrollToBottom();

                                // Free chat: Sync live stream to Firebase every ~1000ms so spectators see it
                                if (Date.now() - lastSyncTime > 1000) {
                                    lastSyncTime = Date.now();
                                    try { await updateDoc(roomRef, { 'state.currentAiStream': fullAiResponse }); } catch (eSync) { }
                                }
                            }
                        } catch (e) { }
                    }
                }
            } catch (error) {
                console.error("Error generating response:", error);
                if (typingIndicator) typingIndicator.classList.remove('active');
                fullAiResponse = fullAiResponse || "⚠️ Failed to retrieve prediction from Ollama.";
                if (streamingBubble) streamingBubble.textContent = fullAiResponse;
                else {
                    const { bubble, wrapper } = createLocalStreamingBubble(fullAiResponse);
                    streamingBubble = bubble;
                    streamingBubbleMsgDiv = wrapper;
                }
            } finally {
                isStreaming = false;

                // Mark the bubble's outer div as pending so the Firestore snapshot can match it
                pendingAiContent = fullAiResponse;
                pendingBubbleMsgDiv = streamingBubbleMsgDiv;
                streamingBubble = null;
                streamingBubbleMsgDiv = null;

                try {
                    const aiIsoString = new Date().toISOString();
                    const msgsRef = collection(db, 'game_rooms', roomId, 'messages');
                    const docRef = await addDoc(msgsRef, { role: 'ai', content: fullAiResponse, timestamp: aiIsoString });
                    // Mark the in-DOM bubble with the Firestore doc ID to prevent re-render
                    if (pendingBubbleMsgDiv) {
                        pendingBubbleMsgDiv.dataset.msgId = docRef.id;
                        displayedMessageIds.add(docRef.id);
                        localMessageContext.push({ role: 'assistant', content: fullAiResponse, isHost: true });
                        pendingBubbleMsgDiv = null;
                        pendingAiContent = null;
                    }
                    await updateDoc(roomRef, { 'state.isAiTyping': false, 'state.currentAiStream': null });
                } catch (err) { console.error("Failed to save final AI msg", err); }

                isGenerating = false;
                if (btnSend && isHost()) btnSend.disabled = userInput ? userInput.value.trim() === '' : true;
                if (userInput) userInput.focus();
            }
        }

        function createLocalStreamingBubble(initialText = '') {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (initialText) bubble.textContent = initialText;
            msgDiv.appendChild(bubble);

            // Insert before typing indicator instead of appending at end
            if (typingIndicator && typingIndicator.parentNode === chatHistory) {
                chatHistory.insertBefore(msgDiv, typingIndicator);
            } else {
                if (chatHistory) chatHistory.appendChild(msgDiv);
            }

            scrollToBottom();
            return { bubble, wrapper: msgDiv };
        }

        // =============================================
        //  GAME MODE LOGIC
        // =============================================

        function startGameModeLogic() {
            const mode = getGameMode();
            if (mode === 'consciousness') startConsciousnessLoop();
            else if (mode === 'questioner') startQuestionerLoop();
        }

        // --- CREATE CONSCIOUSNESS ---
        const RECURSION_INTERVAL = 15000; // 15 seconds between recursions

        async function startConsciousnessLoop() {
            // Check loopAlive — if the agent self-killed, don't revive
            if (roomState?.state?.loopAlive === false) {
                console.log('[aichat] Loop is dead (self-killed). Not reviving.');
                return;
            }
            if (!isOnline || roomState?.status !== 'playing' || getGameMode() !== 'consciousness') {
                console.warn('[aichat] Consciousness loop skipped: online=', isOnline, 'status=', roomState?.status);
                // Retry if just not online yet
                if (isParticipant() && !isOnline && roomState?.status === 'playing') {
                    recursionTimer = setTimeout(() => startConsciousnessLoop(), 3000);
                }
                return;
            }
            // Prevent multiple runners from colliding locally
            if (isGenerating) return;

            // === BUG 2 FIX: Round-trip memory from Firebase ===
            // Always read the latest memory from the live roomState snapshot
            if (roomState?.state?.consciousnessMemory) {
                consciousnessMemory = JSON.parse(JSON.stringify(roomState.state.consciousnessMemory));
            }
            // Ensure arrays exist and CLEAR message arrays so old messages don't loop forever
            consciousnessMemory.hostMessages = [];
            consciousnessMemory.userMessages = [];
            consciousnessMemory.processedMessageIds = consciousnessMemory.processedMessageIds || [];
            consciousnessMemory.recentAiOutputs = consciousnessMemory.recentAiOutputs || [];
            consciousnessMemory.keyInsights = consciousnessMemory.keyInsights || [];
            consciousnessMemory.mistakes = consciousnessMemory.mistakes || [];

            // === BUG 4 FIX: Read human messages from Firebase messages subcollection ===
            // This ensures ALL users' messages reach the prompt, not just the local browser's queue
            try {
                // Fetch the last 20 messages regardless of exact timestamp to avoid the "AI was typing" boundary gap issue
                const msgsRef = collection(db, 'game_rooms', roomId, 'messages');
                // Use limit(20) pattern via descending order then reverse to vastly reduce Firebase bounds
                const recentMsgsQuery = query(msgsRef, orderBy('timestamp', 'desc'), limit(20));
                const recentMsgsSnap = await getDocs(recentMsgsQuery);

                const msgs = [];
                recentMsgsSnap.forEach(docSnap => msgs.push({ id: docSnap.id, ...docSnap.data() }));
                msgs.reverse(); // put back in chronological order

                // append new ones we haven't processed yet
                msgs.slice(-20).forEach(data => {
                    if (data.role === 'user' && data.id && !consciousnessMemory.processedMessageIds.includes(data.id)) {
                        consciousnessMemory.processedMessageIds.push(data.id);
                        const isMsgFromHost = data.authorUid === roomState?.hostUid;
                        const formattedMsg = `[${data.authorName || 'User'}]: ${data.content}`;
                        if (isMsgFromHost) {
                            consciousnessMemory.hostMessages.push(formattedMsg);
                        } else {
                            consciousnessMemory.userMessages.push(formattedMsg);
                        }
                        // Structurally inject it permanently into the Brain episodic memory
                        consciousnessMemory.runningSummary = consciousnessMemory.runningSummary
                            ? `${consciousnessMemory.runningSummary}\n\n[Iter ${consciousnessMemory.iteration}] Human Message:\n${formattedMsg}`
                            : `[Iter ${consciousnessMemory.iteration}] Human Message:\n${formattedMsg}`;
                    }
                });
            } catch (e) {
                console.warn('[aichat] Could not fetch recent messages from Firebase, falling back to local queue', e);
            }

            // Also drain any local queue (messages sent by THIS browser that haven't been written to Firebase yet)
            const drainedMessages = [...humanMessageQueue];
            humanMessageQueue = [];
            drainedMessages.forEach(hm => {
                if (hm.id && !consciousnessMemory.processedMessageIds.includes(hm.id)) {
                    consciousnessMemory.processedMessageIds.push(hm.id);
                    const formattedMsg = `[${hm.authorName || 'User'}]: ${hm.content}`;
                    if (hm.isHost) {
                        consciousnessMemory.hostMessages.push(formattedMsg);
                    } else {
                        consciousnessMemory.userMessages.push(formattedMsg);
                    }
                    // Structurally inject it permanently into the Brain episodic memory
                    consciousnessMemory.runningSummary = consciousnessMemory.runningSummary
                        ? `${consciousnessMemory.runningSummary}\n\n[Iter ${consciousnessMemory.iteration}] Human Message:\n${formattedMsg}`
                        : `[Iter ${consciousnessMemory.iteration}] Human Message:\n${formattedMsg}`;
                }
            });

            isGenerating = true;
            isStreaming = true;
            if (btnSend && isHost()) btnSend.disabled = true;

            try {
                await updateDoc(roomRef, {
                    'state.isAiTyping': true,
                    'state.lastConsciousnessUpdate': Date.now()
                });
            } catch (e) { }

            if (typingIndicator) typingIndicator.classList.add('active');
            scrollToBottom();

            let fullAiResponse = "";
            const iterLabel = `🤖 Consciousness (Iter #${consciousnessMemory.iteration + 1})`;

            try {
                const prompt = buildConsciousnessPrompt();

                const response = await fetch(`${OLLAMA_URL}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: MODEL, prompt: prompt, stream: true })
                });

                if (!response.ok) throw new Error('Ollama error: ' + response.status);
                if (typingIndicator) typingIndicator.classList.remove('active');

                // Create streaming bubble with iteration label
                const { bubble, wrapper } = createLocalStreamingBubble();
                // Add author label to wrapper
                const authorEl = document.createElement('div');
                authorEl.className = 'message-author';
                authorEl.textContent = iterLabel;
                wrapper.insertBefore(authorEl, bubble);
                streamingBubble = bubble;
                streamingBubbleMsgDiv = wrapper;

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let lastSyncTime = Date.now();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    for (const line of chunk.split('\n').filter(l => l.trim())) {

                            const data = JSON.parse(line);

                                fullAiResponse += data.response;
                                if (streamingBubble) streamingBubble.textContent = fullAiResponse;
                                scrollToBottom();

                                // Sync live stream to Firebase every ~1000ms so spectators can see it
                                if (Date.now() - lastSyncTime > 1000) {
                                    lastSyncTime = Date.now();
                                    try { await updateDoc(roomRef, { 'state.currentAiStream': fullAiResponse }); } catch (eSync) { }
                                }

            } catch (error) {

                if (typingIndicator) typingIndicator.classList.remove('active');
                fullAiResponse = fullAiResponse || "⚠️ Consciousness loop paused — Ollama connection failed.";
                if (streamingBubble) streamingBubble.textContent = fullAiResponse;
