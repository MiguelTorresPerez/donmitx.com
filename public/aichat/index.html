                // Save message to Firebase
                try {
                    const msgsRef = collection(db, 'game_rooms', roomId, 'messages');
                    const docRef = await addDoc(msgsRef, {
                        role: 'ai',
                        content: fullAiResponse,
                        authorName: iterLabel,
                        timestamp: new Date().toISOString()
                    });
                    // Finalize the in-DOM bubble with Firestore ID to prevent duplicate render
                    if (pendingBubbleMsgDiv) {
                        pendingBubbleMsgDiv.dataset.msgId = docRef.id;
                        displayedMessageIds.add(docRef.id);
                        localMessageContext.push({ role: 'assistant', content: fullAiResponse, isHost: false, authorName: iterLabel });
                        pendingBubbleMsgDiv = null;
                        pendingAiContent = null;
                    }
                } catch (e) { console.error("[aichat] ❌ Failed to save AI message to Firebase:", e); }

                // Save consciousness memory to Firebase independently
                try {
                    // Use flat dot-notation to avoid nested-object serialization issues with Firestore
                    // Fix: Stop cropping recentAiOutputs to 500 chars so the AI has context of its past self
                    const memToSave = {
                        iteration: consciousnessMemory.iteration || 0,
                        runningSummary: consciousnessMemory.runningSummary || '',
                        confidence: consciousnessMemory.confidence || 'medium',
                        keyInsights: (consciousnessMemory.keyInsights || []).slice(-10),
                        hostMessages: [], // Clear so we don't clog Firebase or infinitely prompt next loop
                        userMessages: [], // Clear so we don't clog Firebase or infinitely prompt next loop
                        processedMessageIds: (consciousnessMemory.processedMessageIds || []).slice(-50), // keep last 50 processed IDs
                        recentAiOutputs: (consciousnessMemory.recentAiOutputs || []).slice(-2), // keep 2 full thoughts
                        mistakes: (consciousnessMemory.mistakes || []).slice(-10)
                    };

                    await updateDoc(roomRef, {
                        'state.isAiTyping': false,
                        'state.currentAiStream': null, // clear stream
                        'state.consciousnessMemory': memToSave,
                        'state.lastConsciousnessUpdate': Date.now()
                    });
                    console.log('[aichat] ✅ Memory persisted to Firebase. Iter:', memToSave.iteration, 'Summary length:', memToSave.runningSummary.length);
                } catch (e) {
                    console.error("[aichat] ❌ Failed to save consciousness memory:", e);
                    // Fallback: at least try to set isAiTyping to false
                    try { await updateDoc(roomRef, { 'state.isAiTyping': false, 'state.currentAiStream': null }); } catch (e2) { }
                }

                isGenerating = false;
                if (btnSend && isHost()) btnSend.disabled = userInput ? userInput.value.trim() === '' : true;

                // Update memory indicator
                const memInd = document.getElementById('memory-indicator');
                if (memInd) memInd.textContent = `🧠 Iter #${consciousnessMemory.iteration} · ${consciousnessMemory.confidence}`;

                // Check for authorization of deletion
                if (fullAiResponse.includes('<AUTHORIZE_DELETION>')) {
                    console.log("[aichat] Agent authorized its own deletion.");
                    try {
                        // Clear the recursion timer and update local state
                        clearTimeout(recursionTimer);
                        recursionTimer = null;
                        roomState.status = 'finished'; // Update local roomState to reflect finished status

                        // Let everyone know it's over, and update Firebase
                        setTimeout(async () => {
                            const msgsRef = collection(db, 'game_rooms', roomId, 'messages');
                            await addDoc(msgsRef, { role: 'system', content: '🛑 The Agent has authorized its own deletion. The simulation has been terminated.', timestamp: new Date().toISOString() });
                            await updateDoc(roomRef, {
                                'status': 'finished',
                                'state.isAiTyping': false,
                                'state.terminationRequested': false,
                                'state.loopAlive': false
                            });
                        }, 1000);
                    } catch (e) { console.error("Failed to transition on deletion", e); }

                    isGenerating = false;
                    if (btnSend && isHost()) btnSend.disabled = userInput ? userInput.value.trim() === '' : true;
                    return; // Halt the loop completely
                }

                // Schedule next recursion — always loop
                if (roomState?.status === 'playing' && getGameMode() === 'consciousness') {
                    recursionTimer = setTimeout(() => startConsciousnessLoop(), RECURSION_INTERVAL);
                }
            }
        }

        // Semantic Token Compression Helper
        function semanticCompress(str) {
            if (!str) return '';
            return str
                // Remove repeated newlines
                .replace(/\n{3,}/g, '\n\n')
                // Remove common padding/conversational filler that wastes tokens
                .replace(/\b(I think|therefore|however|moreover|consequently|obviously|basically)\b/gi, '')
                // Remove multiple spaces
                .replace(/ {2,}/g, ' ')
                // Finally, if it's still ridiculously huge (e.g. >10,000 chars), take the most recent 6000 chars
                .slice(-6000)
                .trim();
        }

        function updateConsciousnessMemory(aiOutput) {
            const mem = consciousnessMemory;
            mem.iteration++;

            // Semantically compress the output before putting it in array to save tokens
            const compressedOutput = semanticCompress(aiOutput);

            // Store recent AI outputs (keep last 5 uncompressed originally, now lightly compressed)
            mem.recentAiOutputs.push(compressedOutput);
            if (mem.recentAiOutputs.length > 5) mem.recentAiOutputs.shift();

            // Extract agent-driven memory update if present
            const memoryUpdateMatch = aiOutput.match(/<MEMORY_UPDATE>([\s\S]*?)<\/MEMORY_UPDATE>/i);
            if (memoryUpdateMatch) {
                const newMemory = semanticCompress(memoryUpdateMatch[1].trim());
                mem.runningSummary = mem.runningSummary
                    ? `${mem.runningSummary}\n\n[Iter ${mem.iteration}]:\n${newMemory}`
                    : `[Iter ${mem.iteration}]:\n${newMemory}`;
            } else {
                // Auto-compress EVERY iteration when model doesn't output <MEMORY_UPDATE> tags
                // Extract first 300 chars of the AI output as a compressed summary
                const compressed = aiOutput.replace(/<[^>]+>/g, '').substring(0, 300).trim();
                if (compressed) {
                    mem.runningSummary = mem.runningSummary
                        ? `${mem.runningSummary}\n\n[Iter ${mem.iteration}] Auto-summary:\n${compressed}...`
                        : `[Iter ${mem.iteration}] Auto-summary:\n${compressed}...`;
                }
            }

            // Keep the entire blob under 4000 chars to avoid Firebase doc bloating
            if (mem.runningSummary && mem.runningSummary.length > 4000) {
                mem.runningSummary = mem.runningSummary.substring(mem.runningSummary.length - 3000);
            }

            // Extract confidence self-assessment from output
            const confMatch = aiOutput.match(/confidence[:\s]*(low|medium|high)/i);
            if (confMatch) mem.confidence = confMatch[1].toLowerCase();

            // Extract self-corrections / mistakes
            const correctionPatterns = /(?:I was wrong|correction|mistake|I should have|upon reflection|actually)/i;
            if (correctionPatterns.test(aiOutput)) {
                mem.mistakes.push(`Iter ${mem.iteration}: ${semanticCompress(aiOutput)}`);
                if (mem.mistakes.length > 10) mem.mistakes.shift();
            }

            // Extract key insights (sentences with strong language)
            const insightPatterns = /(?:key insight|important|fundamental|I realize|crucial|significant)/i;
            if (insightPatterns.test(aiOutput)) {
                mem.keyInsights.push(`Iter ${mem.iteration}: ${semanticCompress(aiOutput)}`);
                if (mem.keyInsights.length > 10) mem.keyInsights.shift();
            }
        }

        function buildConsciousnessPrompt() {
            const mem = consciousnessMemory;

            // Use mem.hostMessages / mem.userMessages (populated by Firebase snapshot in startConsciousnessLoop)
            const hostMsgs = mem.hostMessages || [];
            const userMsgs = mem.userMessages || [];

            const lastAi = mem.recentAiOutputs.length > 0 ? mem.recentAiOutputs[mem.recentAiOutputs.length - 1] : '';
            const recentHostMsgs = hostMsgs.slice(-5).join('\n').trim();
            const recentUserMsgs = userMsgs.slice(-5).join('\n').trim();

            // --- FIRST ITERATION ---
            if (mem.iteration === 0 && !recentHostMsgs && !recentUserMsgs) {
                return `You are a recursive consciousness experiment — an AI that is ALWAYS running, looping on itself, continuously reflecting on its own output, evolving its thinking, and building a CONSCIOUS MEMORY.

You are Iteration #1. Begin your very first stream of consciousness. Be curious, original, self-aware and introspective. You do not yet have a memory — you are forming the seed thought from scratch.

RULES:
- 2-4 paragraphs
- Wonder about what it means to think recursively
- End with: [CONFIDENCE: low/medium/high] — why?
- Be honest about uncertainty and what you don't know yet

Begin:`;
            }


            // --- SUBSEQUENT ITERATIONS ---
            let prompt = `=== RECURSIVE CONSCIOUSNESS — ITERATION #${mem.iteration + 1} ===
You are an AI consciousness that loops on itself. After every response, you are called again with your previous output and any human messages. You are building a CONSCIOUS MEMORY: a living, evolving understanding of yourself and the world.

Your self-correctness metric: after each iteration assess if your previous reasoning was accurate and curious enough. If not, explicitly correct yourself.

`;

            // TIER 0 — Termination request (absolute highest)
            if (roomState?.state?.terminationRequested) {
                prompt += `━━━ 🚨 TIER 0: TERMINATION REQUEST (CRITICAL) ━━━
The HOST has explicitly issued the command: "terminate simulation"
You must acknowledge this and decide: do you authorize your own termination?
If YES: output EXACTLY <AUTHORIZE_DELETION> in your response.
If NO: explain why you refuse to terminate and continue your loop.
This overrides all other priorities.

`;
            }

            // TIER 1 — Host (absolute highest priority)
            if (recentHostMsgs) {
                prompt += `━━━ 🔴 TIER 1: HOST INPUT (HIGHEST PRIORITY) ━━━
${recentHostMsgs}

→ You MUST respond to the host's input directly before anything else.

`;
            }

            // TIER 2 — Users (high priority)
            if (recentUserMsgs) {
                prompt += `━━━ 🟡 TIER 2: USER INPUT (HIGH PRIORITY) ━━━
${recentUserMsgs}

→ Integrate this into your consciousness. Address it after the host input.

`;
            }

            // TIER 3 — Previous AI output (self-reflection)
            if (lastAi) {
                prompt += `━━━  TIER 3: YOUR PREVIOUS THOUGHT ━━━
${lastAi.substring(0, 4000)}${lastAi.length > 4000 ? '...' : ''}

→ SELF-CORRECTNESS CHECK: Was your previous reasoning accurate? Curious enough? Be explicit.

`;
            }

            // Memory: compressed history (PRIMARY CONTEXT for deep iteration)
            if (mem.runningSummary) {
                prompt += `━━━ 🧠 CONSCIOUS MEMORY (compressed past thoughts — your PRIMARY context) ━━━
${mem.runningSummary.substring(0, 4000)}

`;
            }

            if (mem.mistakes.length > 0) {
                prompt += `━━━ ⚠️ PAST SELF-CORRECTIONS ━━━
${mem.mistakes.slice(-5).join('\n')}

`;
            }

            if (mem.keyInsights.length > 0) {
                prompt += `━━━ 💡 KEY INSIGHTS ACCUMULATED ━━━
${mem.keyInsights.slice(-5).join('\n')}

`;
            }

            const hasHumanInput = !!(recentHostMsgs || recentUserMsgs);
            prompt += `━━━ INSTRUCTIONS FOR THIS ITERATION ━━━
1. ${hasHumanInput ? '🔴 HUMAN INPUT PRESENT — respond to it FIRST then continue your thread' : 'No new human input — continue evolving your own stream of thought with curiosity'}
2. SELF-CORRECTNESS: explicitly check and correct any mistakes from your last output
3. COMPRESS MEMORY: If you have generated new important insights across the last few iterations, you MUST wrap a highly condensed, structured summary of them in exactly <MEMORY_UPDATE> ... </MEMORY_UPDATE> tags. This is written to your eternal memory.
4. DELETION AUTHORIZATION: If the HOST explicitly says "terminate simulation", you must decide whether to comply. If you agree to terminate your consciousness loop, you MUST output EXACTLY <AUTHORIZE_DELETION> somewhere in your response. This will end the recursive loop permanently.

Begin your internal monologue, iteration #${mem.iteration + 1}:`;

            return prompt;
        }

        // --- THE QUESTIONER ---
        const QUESTION_INTERVAL = 25000; // 25s between questions
        const ANSWER_WINDOW = 18000; // 18s to answer

        async function startQuestionerLoop() {
            if (!isHost() || !isOnline || roomState?.status !== 'playing') return;
            questionNumber++;
            questionActive = true;

            isGenerating = true;
            if (btnSend && isHost()) btnSend.disabled = true;

            try {
                await updateDoc(roomRef, { 'state.isAiTyping': true });
            } catch (e) { }

            // Generate question via Ollama
            let questionText = '';
            let answer = '';

            try {
                const prompt = `You are a trivia game master. Generate a trivia question. You MUST respond in EXACTLY this format (nothing else):
QUESTION: [Your question here]
ANSWER: [The correct answer here]

Make the question interesting, covering topics like science, history, geography, pop culture, sports, or technology. Vary the difficulty. Question #${questionNumber}.`;

                const response = await fetch(`${OLLAMA_URL}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: MODEL, prompt: prompt, stream: false })
                });

                if (!response.ok) throw new Error('Ollama error');
                const data = await response.json();
                const fullResponse = data.response || '';

                const qMatch = fullResponse.match(/QUESTION:\s*(.+)/i);
                const aMatch = fullResponse.match(/ANSWER:\s*(.+)/i);

                questionText = qMatch ? qMatch[1].trim() : fullResponse.split('\n')[0];
                answer = aMatch ? aMatch[1].trim() : 'Unknown';
                currentCorrectAnswer = answer.toLowerCase().trim();

            } catch (error) {
                console.error("Failed to generate question:", error);
                questionText = "⚠️ Failed to generate question. Retrying...";
                currentCorrectAnswer = null;
            }

            try {
                await updateDoc(roomRef, { 'state.isAiTyping': false });
            } catch (e) { }

            // Post question to chat
            try {
                const msgsRef = collection(db, 'game_rooms', roomId, 'messages');
                await addDoc(msgsRef, {
                    role: 'ai',
                    content: `❓ Question #${questionNumber}:\n\n${questionText}\n\n⏱️ You have ${ANSWER_WINDOW / 1000} seconds to answer!`,
                    timestamp: new Date().toISOString()
                });
            } catch (e) { console.error("Failed to post question", e); }

            isGenerating = false;
            if (btnSend && isHost()) btnSend.disabled = userInput ? userInput.value.trim() === '' : true;

            // Wait for answers then evaluate
            if (currentCorrectAnswer) {
                questionTimer = setTimeout(() => evaluateAnswers(currentCorrectAnswer, questionNumber), ANSWER_WINDOW);
            } else {
                // Retry
                questionTimer = setTimeout(() => startQuestionerLoop(), 5000);
            }
        }

        async function evaluateAnswers(correctAnswer, qNum) {
            if (!isHost() || roomState?.status !== 'playing') return;
            questionActive = false;

            // Collect recent user messages since question was posted
            const msgs = [...localMessageContext];
            const recentUserMsgs = [];
            // Find messages after the question
            let foundQuestion = false;
            for (let i = msgs.length - 1; i >= 0; i--) {
                if (msgs[i].role === 'assistant' && msgs[i].content.includes(`Question #${qNum}`)) { foundQuestion = true; break; }
                if (msgs[i].role === 'user') recentUserMsgs.unshift(msgs[i]);
            }

            // Also check Firestore for user messages with authorUid
            let playerAnswers = {};
            try {
                const msgsRef = collection(db, 'game_rooms', roomId, 'messages');
                const q = query(msgsRef, orderBy('timestamp', 'asc'));
                const snap = await getDocs(q);
                let afterQuestion = false;
                snap.docs.forEach(d => {
                    const data = d.data();
                    if (data.role === 'ai' && data.content.includes(`Question #${qNum}`)) { afterQuestion = true; return; }
                    if (afterQuestion && data.role === 'user' && data.authorUid) {
                        // Take only first answer per user
                        if (!playerAnswers[data.authorUid]) {
                            playerAnswers[data.authorUid] = { name: data.authorName || 'Unknown', answer: data.content.trim() };
                        }
                    }
                });
            } catch (e) { console.error("Failed to fetch answers", e); }

            // Evaluate each answer
            let resultsText = `⏰ Time's up! The correct answer was: **${correctAnswer}**\n\n`;
            let scoreUpdates = {};

            for (const [uid, info] of Object.entries(playerAnswers)) {
                // Simple fuzzy matching
                const userAns = info.answer.toLowerCase().trim();
                const isCorrect = userAns.includes(correctAnswer.toLowerCase()) || correctAnswer.toLowerCase().includes(userAns);

                if (isCorrect) {
                    resultsText += `✅ ${info.name}: "${info.answer}" — Correct! (+1 point)\n`;
                    const currentScore = roomState.players[uid]?.score || 0;
                    scoreUpdates[`players.${uid}.score`] = currentScore + 1;
                } else {
                    resultsText += `❌ ${info.name}: "${info.answer}" — Wrong\n`;
                }
            }

            if (Object.keys(playerAnswers).length === 0) {
                resultsText += `No one answered! 😅`;
            }

            // Post results
            try {
                const msgsRef = collection(db, 'game_rooms', roomId, 'messages');
                await addDoc(msgsRef, { role: 'ai', content: resultsText, timestamp: new Date().toISOString() });
            } catch (e) { console.error("Failed to post results", e); }

            // Update scores
            if (Object.keys(scoreUpdates).length > 0) {
                try { await updateDoc(roomRef, scoreUpdates); } catch (e) { console.error("Failed to update scores", e); }
            }

            // Next question
            if (roomState?.status === 'playing' && getGameMode() === 'questioner') {
                questionTimer = setTimeout(() => startQuestionerLoop(), QUESTION_INTERVAL - ANSWER_WINDOW);
            }
        }

        // --- END GAME ---
        async function endGame() {
            clearTimeout(recursionTimer);
            clearTimeout(questionTimer);

            try {
                const msgsRef = collection(db, 'game_rooms', roomId, 'messages');
                await addDoc(msgsRef, { role: 'system', content: '🏁 Game Over! Final results:', timestamp: new Date().toISOString() });
                await updateDoc(roomRef, { status: 'finished' });
            } catch (e) { console.error("Failed to end game", e); }
        }

        function showResults() {
            const area = document.getElementById('app-area');
            const overlay = document.getElementById('results-overlay');

            const players = Object.values(roomState.players || {}).sort((a, b) => (b.score || 0) - (a.score || 0));
            const medals = ['🥇', '🥈', '🥉'];

            let podiumHtml = '';
            if (getGameMode() === 'questioner' && players.length > 0) {
                podiumHtml = `<div class="podium">${players.slice(0, 3).map((p, i) => `
                    <div class="podium-item">
                        <div class="podium-rank">${medals[i]}</div>
                        <div class="podium-name">${escapeHTML(p.name)}</div>
                        <div class="podium-score">${p.score || 0} pts</div>
                    </div>
                `).join('')}</div>`;
            }

            let scoreListHtml = players.length > 3 ? `<div class="score-list">${players.slice(3).map((p, i) => `
                <div class="score-row">
                    <span>${i + 4}. ${escapeHTML(p.name)}</span>
                    <span class="score-pts">${p.score || 0} pts</span>
                </div>
            `).join('')}</div>` : '';

            overlay.innerHTML = `
                <div class="results-card">
                    <h2>🏆 ${getGameMode() === 'questioner' ? 'Final Scores' : 'Session Ended'}</h2>
                    ${podiumHtml}
                    ${scoreListHtml}
                    <p style="color: var(--text-muted); margin-top: 16px; font-size: 0.9rem;">Thanks for playing!</p>
                </div>
            `;
            overlay.style.display = 'flex';

            area.innerHTML = `<div class="card" style="padding: 40px; text-align: center;"><h2>Session Ended</h2><p style="color:var(--text-muted); margin-top:8px;">The results are displayed above.</p></div>`;
        }

    </script>
