                            log.push(`> ${mon.name} made a Wish!`);
                        }
                        if (fx.healingWish) {
                            mon.currentHp = 0;
                            state.healingWish = state.healingWish || {};
                            state.healingWish[uid] = true;
                        }
                        if (fx.painSplit && !subBlocks) {
                            const avg = Math.floor((mon.currentHp + defMon.currentHp) / 2);
                            mon.currentHp = Math.min(mon.hp, avg);
                            defMon.currentHp = Math.min(defMon.hp, avg);
                            log.push(`> The battlers shared their pain!`);
                        }
                        if (fx.removeTargetItem && defMon.item && !subBlocks) {
                            log.push(`> ${mon.name} knocked off ${defMon.name}'s ${defMon.item}!`);
                            defMon.item = null;
                        }
                        if (fx.forceSwitch && defMon.currentHp > 0 && !subBlocks) {
                            if (defMon.ability === 'Suction Cups' || defMon.ingrained) {
                                log.push(`> ${defMon.name} anchors itself!`);
                            } else {
                                const aliveBenched = teams[defUid].map((m, i) => m.currentHp > 0 && i !== activeIdx[defUid] ? i : -1).filter(i => i !== -1);
                                if (aliveBenched.length > 0) {
                                    const oldMon = getMon(defUid);
                                    oldMon.boosts = { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, accuracy: 0, evasion: 0 };
                                    oldMon.choiceLock = null;
                                    oldMon.seeded = false;
                                    oldMon.taunt = 0;
                                    oldMon.encore = 0;
                                    oldMon.substituteHp = 0;
                                    oldMon.perishSong = 0;
                                    oldMon.destinyBond = false;

                                    const newIdx = aliveBenched[Math.floor(Math.random() * aliveBenched.length)];
                                    activeIdx[defUid] = newIdx;
                                    log.push(`> ${defMon.name} was dragged out! ${getMon(defUid).name} was dragged in!`);
                                }
                            }
                        }
                        if (fx.pivot) {
                            const aliveBenched = teams[uid].filter((m, i) => m.currentHp > 0 && i !== activeIdx[uid]);
                            if (aliveBenched.length > 0) {
                                // For simplicity, we auto switch them to the first alive benched
                                const oldMon = getMon(uid);
                                oldMon.boosts = { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, accuracy: 0, evasion: 0 };
                                oldMon.choiceLock = null;
                                oldMon.seeded = false;
                                oldMon.taunt = 0;
                                oldMon.encore = 0;
                                oldMon.substituteHp = 0;
                                oldMon.perishSong = 0;
                                oldMon.destinyBond = false;

                                const benchedIds = teams[uid].map((m, i) => m.currentHp > 0 && i !== activeIdx[uid] ? i : -1).filter(i => i !== -1);
                                const newIdx = benchedIds[0];
                                activeIdx[uid] = newIdx;
                                log.push(`> ${mon.name} went back to ${roomState.players[uid].name}!`);
                                log.push(`> ${roomState.players[uid].name} sent out ${getMon(uid).name}!`);
                            }
                        }
                    }
                }
            }

            // 4. End of turn effects

            // Clear protect flags
            for (const uid of [p1Uid, p2Uid]) {
                const mon = getMon(uid);
                mon.protecting = false;
                const usedMove = actions[uid]?.type === 'move' ? MOVES[actions[uid]?.val] : null;
                if (!usedMove || !(usedMove.effects && usedMove.effects.protect)) {
                    mon.protectLastTurn = false;
                }

                // Screen turns
                const screens = state.screens[uid] || {};
                for (const screen in screens) {
                    if (screens[screen] > 0) {
                        screens[screen]--;
                        if (screens[screen] === 0) log.push(`> ${roomState.players[uid].name}'s ${screen} wore off!`);
                    }
                }

                // Taunt / Encore / Destiny Bond fading
                if (mon.taunt > 0) { mon.taunt--; if (mon.taunt === 0) log.push(`> ${mon.name}'s taunt wore off!`); }
                if (mon.encore > 0) { mon.encore--; if (mon.encore === 0) log.push(`> ${mon.name}'s encore ended!`); }
                mon.destinyBond = false;
            }

            // Weather countdown
            if (state.weatherTurns > 0) {
                state.weatherTurns--;
                if (state.weatherTurns === 0) {
                    const wNames = { Sun: 'harsh sunlight', Rain: 'rain', Sand: 'the sandstorm', Snow: 'the snow' };
                    log.push(`> ${wNames[state.weather] || 'The weather'} subsided!`);
                    state.weather = null;
                }
            }

            // End of turn damage/healing
            for (const uid of [p1Uid, p2Uid]) {
                const mon = getMon(uid);
                if (mon.currentHp === 0) continue;

                // Wish
                if (state.wish && state.wish[uid]) {
                    mon.currentHp = Math.min(mon.hp, mon.currentHp + state.wish[uid].hp);
                    log.push(`> ${mon.name}'s wish came true!`);
                    state.wish[uid] = null;
                }

                // Weather Damage
                if (state.weather === 'Sand' && !mon.types.includes('Rock') && !mon.types.includes('Ground') && !mon.types.includes('Steel') && mon.item !== 'Heavy-Duty Boots') {
                    mon.currentHp = Math.max(0, mon.currentHp - Math.floor(mon.hp / 16));
                    log.push(`> ${mon.name} is buffeted by the sandstorm!`);
                }

                // Status Damage
                if (mon.status === 'BRN') {
                    mon.currentHp = Math.max(0, mon.currentHp - Math.floor(mon.hp / 16));
                    log.push(`> ${mon.name} was hurt by its burn!`);
                } else if (mon.status === 'PSN') {
                    mon.currentHp = Math.max(0, mon.currentHp - Math.floor(mon.hp / 8));
                    log.push(`> ${mon.name} was hurt by poison!`);
                } else if (mon.status === 'TOX') {
                    mon.currentHp = Math.max(0, mon.currentHp - Math.floor(mon.hp * (mon.toxicCounter / 16)));
                    mon.toxicCounter++;
                    log.push(`> ${mon.name} was hurt by toxic poison!`);
                }

                // Cursed
                if (mon.cursed) {
                    mon.currentHp = Math.max(0, mon.currentHp - Math.floor(mon.hp / 4));
                    log.push(`> ${mon.name} is afflicted by the curse!`);
                }

                // Leech Seed
                if (mon.seeded) {
                    const dmg = Math.floor(mon.hp / 8) || 1;
                    mon.currentHp = Math.max(0, mon.currentHp - dmg);
                    const enemyUid = uid === p1Uid ? p2Uid : p1Uid;
                    const enemyMon = getMon(enemyUid);
                    if (enemyMon.currentHp > 0) {
                        enemyMon.currentHp = Math.min(enemyMon.hp, enemyMon.currentHp + dmg);
                    }
                    log.push(`> ${mon.name}'s health is sapped by Leech Seed!`);
                }

                // Items
                if (mon.item === 'Leftovers') {
                    mon.currentHp = Math.min(mon.hp, mon.currentHp + Math.floor(mon.hp / 16));
                    log.push(`> ${mon.name} restored a little HP using its Leftovers!`);
                } else if (mon.item === 'Black Sludge') {
                    if (mon.types.includes('Poison')) {
                        mon.currentHp = Math.min(mon.hp, mon.currentHp + Math.floor(mon.hp / 16));
                        log.push(`> ${mon.name} restored a little HP using its Black Sludge!`);
                    } else {
                        mon.currentHp = Math.max(0, mon.currentHp - Math.floor(mon.hp / 8));
                        log.push(`> ${mon.name} was hurt by its Black Sludge!`);
                    }
                } else if (mon.item === 'Toxic Orb' && !mon.status && !mon.types.includes('Steel') && !mon.types.includes('Poison')) {
                    mon.status = 'TOX'; mon.toxicCounter = 1;
                    log.push(`<span class="status-TOX">${mon.name} was badly poisoned by the Toxic Orb!</span>`);
                } else if (mon.item === 'Flame Orb' && !mon.status && !mon.types.includes('Fire')) {
                    mon.status = 'BRN';
                    log.push(`<span class="status-BRN">${mon.name} was burned by the Flame Orb!</span>`);
                } else if ((mon.item === 'Sitrus Berry' || mon.item === 'Lum Berry') && mon.currentHp > 0) {
                    if (mon.item === 'Sitrus Berry' && mon.currentHp <= mon.hp / 2) {
                        mon.currentHp = Math.min(mon.hp, Math.floor(mon.currentHp + (mon.hp / 4)));
                        log.push(`> ${mon.name} restored HP using its Sitrus Berry!`);
                        mon.item = null;
                    } else if (mon.item === 'Lum Berry' && mon.status) {
                        log.push(`> ${mon.name} cured its ${mon.status} using its Lum Berry!`);
                        mon.status = null;
                        mon.item = null;
                    }
                } else if (mon.item === 'White Herb') {
                    let used = false;
                    for (const s in mon.boosts) {
                        if (mon.boosts[s] < 0) { mon.boosts[s] = 0; used = true; }
                    }
                    if (used) {
                        log.push(`> ${mon.name} restored its stats using its White Herb!`);
                        mon.item = null;
                    }
                }

                if (mon.perishSong > 0) {
                    mon.perishSong--;
                    log.push(`> ${mon.name}'s perish count fell to ${mon.perishSong}.`);
                    if (mon.perishSong === 0) {
                        mon.currentHp = 0;
                    }
                }

                // End-of-turn form changes
                // Zen Mode: Darmanitan morphs if HP <= 50%
                if (mon.ability === 'Zen Mode' && mon.currentHp > 0) {
                    const hpPct = mon.currentHp / mon.hp;
                    if (hpPct <= 0.5 && !mon.id.includes('zen')) {
                        const zenForm = POKEMON_DB.find(p => p.id === 'darmanitanzen' || p.id === 'darmanitangalarzen');
                        if (zenForm) {
                            mon.name = zenForm.name; mon.id = zenForm.id;
                            mon.types = [...zenForm.types]; mon.atk = zenForm.atk; mon.def = zenForm.def;
                            mon.spa = zenForm.spa; mon.spd = zenForm.spd; mon.spe = zenForm.spe;
                            mon.sprite = zenForm.sprite; mon.spriteBack = zenForm.spriteBack;
                            log.push(`> <span style="color:var(--accent)">${mon.name} entered Zen Mode!</span>`);
                        }
                    } else if (hpPct > 0.5 && mon.id.includes('zen')) {
                        const baseForm = POKEMON_DB.find(p => p.id === 'darmanitan' || (p.id.includes('darmanitan') && !p.id.includes('zen')));
                        if (baseForm) {
                            mon.name = baseForm.name; mon.id = baseForm.id;
                            mon.types = [...baseForm.types]; mon.atk = baseForm.atk; mon.def = baseForm.def;
                            mon.spa = baseForm.spa; mon.spd = baseForm.spd; mon.spe = baseForm.spe;
                            mon.sprite = baseForm.sprite; mon.spriteBack = baseForm.spriteBack;
                            log.push(`> <span style="color:var(--accent)">${mon.name} exited Zen Mode!</span>`);
                        }
                    }
                }

                // Ice Face: restores in Snow
                if (mon.ability === 'Ice Face' && mon.iceFaceBroken && state.weather === 'Snow') {
                    const iceForm = POKEMON_DB.find(p => p.id === 'eiscue');
                    if (iceForm) {
                        mon.name = iceForm.name; mon.id = iceForm.id;
                        mon.types = [...iceForm.types]; mon.atk = iceForm.atk; mon.def = iceForm.def;
                        mon.spa = iceForm.spa; mon.spd = iceForm.spd; mon.spe = iceForm.spe;
                        mon.sprite = iceForm.sprite; mon.spriteBack = iceForm.spriteBack;
                        mon.iceFaceBroken = false;
                        log.push(`> <span style="color:var(--accent)">${mon.name}'s Ice Face was restored!</span>`);
                    }
                }

                // Schooling: Wishiwashi morphs if HP > 25% and level/stats are sufficient
                if (mon.ability === 'Schooling' && mon.currentHp > 0) {
                    const hpPct = mon.currentHp / mon.hp;
                    if (hpPct > 0.25 && !mon.id.includes('school')) {
                        if (morphToForm(mon, 'wishiwashischool')) {
                            log.push(`> <span style="color:var(--accent)">${mon.name} formed a school!</span>`);
                        }
                    } else if (hpPct <= 0.25 && mon.id.includes('school')) {
                        if (morphToForm(mon, 'wishiwashisolo') || morphToForm(mon, 'wishiwashi')) {
                            log.push(`> <span style="color:var(--accent)">${mon.name}'s school dispersed!</span>`);
                        }
                    }
                }

                // Shields Down: Minior toggles based on HP > 50%
                if (mon.ability === 'Shields Down' && mon.currentHp > 0) {
                    const hpPct = mon.currentHp / mon.hp;
                    if (hpPct <= 0.5 && mon.id.includes('meteor')) {
                        if (morphToForm(mon, 'minior') || morphToForm(mon, 'miniorred')) {
                            log.push(`> <span style="color:var(--accent)">${mon.name}'s shell smashed!</span>`);
                        }
                    } else if (hpPct > 0.5 && !mon.id.includes('meteor')) {
                        if (morphToForm(mon, 'miniorredmeteor') || morphToForm(mon, 'miniormeteor')) {
                            log.push(`> <span style="color:var(--accent)">${mon.name} is protected by its shell!</span>`);
                        }
                    }
                }

                // Power Construct: Zygarde morphs if HP <= 50%
                if (mon.ability === 'Power Construct' && mon.currentHp > 0 && !mon.id.includes('complete')) {
                    const hpPct = mon.currentHp / mon.hp;
                    if (hpPct <= 0.5) {
                        const completeForm = POKEMON_DB.find(p => p.id === 'zygardecomplete');
                        if (completeForm) {
                            const oldMax = mon.hp;
                            mon.name = completeForm.name; mon.id = completeForm.id;
                            mon.hp = completeForm.hp;
                            mon.currentHp += (mon.hp - oldMax); // Heal by the difference
                            mon.atk = completeForm.atk; mon.def = completeForm.def;
                            mon.spa = completeForm.spa; mon.spd = completeForm.spd;
                            mon.spe = completeForm.spe;
                            mon.sprite = completeForm.sprite; mon.spriteBack = completeForm.spriteBack;
                            log.push(`> <span style="color:var(--accent)">${mon.name} transformed into its Complete Forme!</span>`);
                        }
                    }
                }

                if (mon.currentHp === 0) log.push(`<span class="fainted-text">${mon.name} fainted!</span>`);
            }

            // Intimidate on switch-in
            for (const uid of [p1Uid, p2Uid]) {
                if (actions[uid]?.type === 'switch') {
                    const mon = getMon(uid);
                    if (mon.ability === 'Intimidate' && mon.currentHp > 0) {
                        const oppUid2 = uid === p1Uid ? p2Uid : p1Uid;
                        const oppMon = getMon(oppUid2);
                        if (oppMon.currentHp > 0) {
                            oppMon.boosts.atk = Math.max(-6, oppMon.boosts.atk - 1);
                            log.push(`> ${mon.name}'s Intimidate lowered ${oppMon.name}'s Attack!`);
                        }
                    }
                }
            }

            let p1Living = teams[p1Uid].some(p => p.currentHp > 0);
            let p2Living = teams[p2Uid].some(p => p.currentHp > 0);

            if (!p1Living || !p2Living) {
                matchOver = true;
                if (!p1Living && !p2Living) log.push('It is a draw!');
                else if (p1Living) log.push(`${roomState.players[p1Uid].name} wins the battle!`);
                else log.push(`${roomState.players[p2Uid].name} wins the battle!`);
            } else {
                // If match is not over, check for faints to trigger faintReplacement
                if (getMon(p1Uid).currentHp <= 0 || getMon(p2Uid).currentHp <= 0) {
                    if (log.length > 20) log = log.slice(-20);
                    await updateDoc(roomRef, {
                        'state.resolving': false,
                        'state.actions': {},
                        'state.faintReplacement': true,
                        'state.log': log,
                        'state.active': activeIdx,
                        'state.weather': state.weather || null,
                        'state.weatherTurns': state.weatherTurns || 0,
                        [`players.${p1Uid}.team`]: teams[p1Uid],
                        [`players.${p2Uid}.team`]: teams[p2Uid]
                    });
                    return;
                }
            }

            if (log.length > 20) log = log.slice(-20);

            if (matchOver) {
                await updateDoc(roomRef, {
                    status: 'finished',
                    'state.log': log,
                    'state.weather': state.weather || null,
                    'state.weatherTurns': state.weatherTurns || 0,
                    [`players.${p1Uid}.team`]: teams[p1Uid],
                    [`players.${p2Uid}.team`]: teams[p2Uid]
                });
            } else {
                await updateDoc(roomRef, {
                    'state.resolving': false,
                    'state.actions': {},
                    'state.turn': state.turn + 1,
                    'state.log': log,
                    'state.active': activeIdx,
                    'state.weather': state.weather || null,
                    'state.weatherTurns': state.weatherTurns || 0,
                    [`players.${p1Uid}.team`]: teams[p1Uid],
                    [`players.${p2Uid}.team`]: teams[p2Uid]
                });
            }
        }

        // GUI View
        function getHpColor(pct) {
            if (pct > 0.5) return 'var(--success)';
            if (pct > 0.2) return 'var(--warning)';
            return 'var(--danger)';
        }

        window.showMonInfo = function (uid) {
            const state = roomState.state;
            const activeIdx = state.active[uid] ?? 0;
            const mon = roomState.players[uid].team[activeIdx];
            if (!mon) return;

            const calcStat = (base, boost) => boost >= 0 ? Math.floor(base * ((2 + boost) / 2)) : Math.floor(base * (2 / (2 - boost)));

            const html = `
                <div style="display:flex; gap:15px; align-items:flex-start;">
                    <img src="${mon.sprite}" style="width:80px; height:80px; object-fit:contain;">
                    <div style="flex:1;">
                        <h3 style="margin:0 0 5px;">${esc(mon.name)}</h3>
                        <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:10px;">
                            <div><b>Types:</b> ${mon.types.join(' / ')}</div>
                            <div><b>Ability:</b> ${mon.ability || 'Unknown'}</div>
                            <div><b>Item:</b> ${mon.item || 'None'}</div>
                            ${mon.status ? `<div><b>Status:</b> <span class="status-${mon.status}">${mon.status}</span></div>` : ''}
                        </div>
                    </div>
                </div>
                <hr style="border-color:rgba(255,255,255,0.1); margin:10px 0;">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:0.85rem;">
                    <div><b>HP:</b> ${mon.currentHp}/${mon.hp}</div>
                    <div><b>Attack:</b> <span style="color:${mon.boosts.atk > 0 ? 'var(--success)' : mon.boosts.atk < 0 ? 'var(--danger)' : 'inherit'}">${calcStat(mon.atk, mon.boosts.atk)}</span> ${mon.boosts.atk !== 0 ? `(${mon.boosts.atk > 0 ? '+' : ''}${mon.boosts.atk})` : ''}</div>
                    <div><b>Defense:</b> <span style="color:${mon.boosts.def > 0 ? 'var(--success)' : mon.boosts.def < 0 ? 'var(--danger)' : 'inherit'}">${calcStat(mon.def, mon.boosts.def)}</span> ${mon.boosts.def !== 0 ? `(${mon.boosts.def > 0 ? '+' : ''}${mon.boosts.def})` : ''}</div>
                    <div><b>Sp. Atk:</b> <span style="color:${mon.boosts.spa > 0 ? 'var(--success)' : mon.boosts.spa < 0 ? 'var(--danger)' : 'inherit'}">${calcStat(mon.spa, mon.boosts.spa)}</span> ${mon.boosts.spa !== 0 ? `(${mon.boosts.spa > 0 ? '+' : ''}${mon.boosts.spa})` : ''}</div>
                    <div><b>Sp. Def:</b> <span style="color:${mon.boosts.spd > 0 ? 'var(--success)' : mon.boosts.spd < 0 ? 'var(--danger)' : 'inherit'}">${calcStat(mon.spd, mon.boosts.spd)}</span> ${mon.boosts.spd !== 0 ? `(${mon.boosts.spd > 0 ? '+' : ''}${mon.boosts.spd})` : ''}</div>
                    <div><b>Speed:</b> <span style="color:${mon.boosts.spe > 0 ? 'var(--success)' : mon.boosts.spe < 0 ? 'var(--danger)' : 'inherit'}">${calcStat(mon.spe, mon.boosts.spe)}</span> ${mon.boosts.spe !== 0 ? `(${mon.boosts.spe > 0 ? '+' : ''}${mon.boosts.spe})` : ''}</div>
                </div>
                <div style="margin-top:15px; text-align:right;">
                    <button class="btn btn-sm" onclick="document.getElementById('modal-mon-info').style.display='none'">Close</button>
                </div>
            `;
            document.getElementById('mon-info-content').innerHTML = html;
            document.getElementById('modal-mon-info').style.display = 'flex';
        }

        window.showBenchInfo = function (uid, idx) {
            const mon = roomState.players[uid]?.team?.[idx];
            if (!mon) return;

            const calcStat = (base, boost) => boost >= 0 ? Math.floor(base * ((2 + boost) / 2)) : Math.floor(base * (2 / (2 - boost)));

            const html = `
                <div style="display:flex; gap:15px; align-items:flex-start;">
                    <img src="${mon.sprite}" style="width:80px; height:80px; object-fit:contain;">
                    <div style="flex:1;">
                        <h3 style="margin:0 0 5px;">${esc(mon.name)}</h3>
                        <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:10px;">
                            <div><b>Types:</b> ${mon.types.join(' / ')}</div>
                            <div><b>Ability:</b> ${mon.ability || 'Unknown'}</div>
                            <div><b>Item:</b> ${mon.item || 'None'}</div>
                            ${mon.status ? `<div><b>Status:</b> <span class="status-${mon.status}">${mon.status}</span></div>` : ''}
                        </div>
                    </div>
                </div>
                <hr style="border-color:rgba(255,255,255,0.1); margin:10px 0;">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:0.85rem;">
                    <div><b>HP:</b> ${mon.currentHp}/${mon.hp}</div>
                    <div><b>Atk:</b> ${calcStat(mon.atk, mon.boosts?.atk || 0)}</div>
                    <div><b>Def:</b> ${calcStat(mon.def, mon.boosts?.def || 0)}</div>
                    <div><b>SpA:</b> ${calcStat(mon.spa, mon.boosts?.spa || 0)}</div>
                    <div><b>SpD:</b> ${calcStat(mon.spd, mon.boosts?.spd || 0)}</div>
                    <div><b>Spe:</b> ${calcStat(mon.spe, mon.boosts?.spe || 0)}</div>
                </div>
                <div style="margin-top:10px; font-size:0.8rem;">
                    <b>Moves:</b> ${(mon.moves || []).map(m => MOVES[m]?.name || m).join(', ')}
                </div>
                <div style="margin-top:15px; text-align:right;">
                    <button class="btn btn-sm" onclick="document.getElementById('modal-mon-info').style.display='none'">Close</button>
                </div>
            `;
            document.getElementById('mon-info-content').innerHTML = html;
            document.getElementById('modal-mon-info').style.display = 'flex';
        };

        function renderBattle() {
            const state = roomState.state;
            const uids = Object.keys(roomState.players || {});
            const isSpectator = !roomState.players[currentUser.uid];

            let myUid = isSpectator ? uids[0] : currentUser.uid;
            let oppUid = isSpectator ? uids[1] : uids.find(id => id !== myUid);

            const myTeamFull = roomState.players[myUid]?.team;
            const oppTeamFull = oppUid ? roomState.players[oppUid]?.team : undefined;

            if (!state || !state.active || !myTeamFull || !oppTeamFull || !oppUid) {
                let errs = [];
                if (!state) errs.push('state');
                else if (!state.active) errs.push('state.active');
                if (!myTeamFull) errs.push('myTeamFull');
                if (!oppUid) errs.push('oppUid');
                if (!oppTeamFull && oppUid) errs.push('oppTeamFull');

                return `<div class="spinner"></div>
                    <p>Synchronizing battle connection...</p>
                    <p style="color:var(--danger); font-size:0.8rem; margin-top:10px; padding:10px; background:rgba(0,0,0,0.5); border-radius:8px;">
                        <b>Debug Missing Data:</b> ${errs.join(', ')}
                    </p>`;
            }

            const myActiveIdx = state.active[myUid] ?? 0;
            const oppActiveIdx = state.active[oppUid] ?? 0;

            const myActive = myTeamFull[myActiveIdx];
            const oppActive = oppTeamFull[oppActiveIdx];

            if (!myActive || !oppActive) {
                let errs2 = [];
                if (!myActive) errs2.push('myActive');
                if (!oppActive) errs2.push('oppActive');
                return `<div class="spinner"></div>
                    <p>Awaiting Team Data...</p>
                    <p style="color:var(--danger); font-size:0.8rem; margin-top:10px; padding:10px; background:rgba(0,0,0,0.5); border-radius:8px;">
                        <b>Debug Missing Data:</b> ${errs2.join(', ')}
                    </p>`;
            }

            const myHpPct = myActive.currentHp / myActive.hp;
            const oppHpPct = oppActive.currentHp / oppActive.hp;

            const amIWaiting = isSpectator ? true : ((state.actions && !!state.actions[myUid]) || state.resolving);
            const activeIsFainted = myActive.currentHp <= 0;

            const isTrapped = (myActive.trapped || (oppActive.ability === 'Shadow Tag' && myActive.ability !== 'Shadow Tag') || (oppActive.ability === 'Arena Trap' && !myActive.types.includes('Flying') && myActive.ability !== 'Levitate')) && !myActive.types.includes('Ghost');

            const renderStatusBadges = (mon) => {
                let s = '';
                if (mon.status) {
                    s += `<span class="badge" style="background:var(--${mon.status === 'BRN' || Math.random() < 0 ? 'danger' : 'warning'}); color:white; margin-left:5px;">${mon.status}</span>`;
                }
                const statMap = { atk: 'Atk', def: 'Def', spa: 'SpA', spd: 'SpD', spe: 'Spe' };
                if (mon.boosts) {
                    for (const [k, v] of Object.entries(mon.boosts)) {
                        if (v !== 0 && statMap[k]) {
                            const sym = v > 0 ? '+' : '';
                            s += `<span class="badge" style="background:${v > 0 ? 'var(--success)' : 'var(--danger)'}; color:white; margin-left:5px; font-size: 0.7rem;">${sym}${v} ${statMap[k]}</span>`;
                        }
                    }
                }
                return s;
            };

            let html = `
                <!-- Scene -->
                <div class="battle-scene">
                    <div class="hud opponent">
                        <div class="hud-name">
                            ${esc(oppActive.name)} <span class="level">Lv100</span>
                            ${renderStatusBadges(oppActive)}
                            <button class="btn btn-sm text-muted" style="padding:0px 4px; float:right;" onclick="window.showMonInfo('${oppUid}')">ℹ️</button>
                        </div>
                        <div class="hp-bar-bg"><div class="hp-bar-fill" style="width:${oppHpPct * 100}%; background-color:${getHpColor(oppHpPct)}"></div></div>
                        <div class="hp-text">${oppActive.currentHp}/${oppActive.hp}</div>
                    </div>
                    
                    <div class="hud player">
                        <div class="hud-name">
                            ${esc(myActive.name)} <span class="level">Lv100</span>
                            ${renderStatusBadges(myActive)}
                            <button class="btn btn-sm text-muted" style="padding:0px 4px; float:right;" onclick="window.showMonInfo('${myUid}')">ℹ️</button>
                        </div>
                        <div class="hp-bar-bg"><div class="hp-bar-fill" style="width:${myHpPct * 100}%; background-color:${getHpColor(myHpPct)}"></div></div>
                        <div class="hp-text">${myActive.currentHp}/${myActive.hp}</div>
                    </div>

                    <div class="platform opponent"></div>
                    <img src="${oppActive.sprite}" class="sprite opponent ${oppActive.currentHp <= 0 ? 'fainted' : ''}" style="filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.5));">
                    
                    <div class="platform player"></div>
                    <img src="${myActive.spriteBack}" class="sprite player ${myActive.currentHp <= 0 ? 'fainted' : ''}" style="filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.5));">
                </div>

                <!-- Log below battlefield -->
                <div class="battle-log" id="b-log" style="max-height:80px; overflow-y:auto; margin-bottom:12px; font-size:0.75rem;">
                    ${(state.log || []).slice(-8).map(l => `<p style="margin:2px 0;">${l}</p>`).join('')}
                </div>

                <!-- Controls -->
                <div class="battle-controls" style="width:100%;">`;

            if (isSpectator) {
                html += `
                        <div style="display:flex; height:100%; flex-direction:column; justify-content:center; align-items:center;">
                            <h3 style="color:var(--text-muted); margin-bottom:10px;">Spectating Mode</h3>
                            <p style="font-size:0.8rem; color:var(--text-muted);">You are watching ${esc(roomState.players[uids[0]].name)} vs ${esc(roomState.players[uids[1]].name)}</p>
                        </div>
                    </div>
                </div>`;
                return html;
            }

            html += `
                            ${activeIsFainted ? `
                            <p class="warning-text" style="display:block; text-align:left;">${esc(myActive.name)} fainted! Send out another Pokémon.</p>
                        ` : (amIWaiting && !state.faintReplacement) ? `
                            <p class="text-muted" style="text-align:left;">Waiting for opponent to act...</p>
                            <div class="spinner" style="margin: 0; width: 25px; height: 25px;"></div>
                            ${state.actions && state.actions[myUid] && !state.resolving ? `
                               <div style="text-align:center; margin-top:20px;">
                                   <button class="btn" style="background:var(--danger); color:white;" onclick="window.cancelAction()">Cancel Action</button>
                               </div>
                            ` : ''}
                        ` : state.faintReplacement ? `
                            <p class="warning-text" style="display:block; text-align:left; color: var(--warning);">Waiting for opponent to send out a replacement...</p>
                            <div class="spinner" style="margin: 0; width: 25px; height: 25px;"></div>
                        ` : `
                            <div style="font-size:0.8rem; font-weight:700; margin-bottom:4px; text-align:left;">What will ${esc(myActive.name)} do?</div>
                            ${(() => {
                    if (state.megaEvolved && state.megaEvolved[myUid]) return '';
                    const megaForm = POKEMON_DB.find(p => p.isMega && p.baseSpecies === myActive.id && p.requiredItem === myActive.item);
                    if (megaForm) {
                        return `<div style="margin-bottom: 8px;"><label style="font-size:0.8rem; font-weight:bold; color:var(--accent); cursor:pointer;"><input type="checkbox" id="mega-evolve-checkbox" style="margin-right: 4px;"> <span class="crystal-icon">💎</span> Mega Evolve</label></div>`;
                    }
                    return '';
                })()}
                            <div class="move-grid">
                            ${myActive.moves.map((moveId, i) => {
                    const m = MOVES[moveId] || MOVES['struggle'];
                    const eff = getEffectiveness(m.type, oppActive.types);
                    let effColor = '#ffffff';
                    let effText = '';
                    if (m.category !== 'Status') {
                        if (eff >= 4) { effColor = '#ef4444'; effText = '(4x)'; }
                        else if (eff >= 2) { effColor = '#f97316'; effText = '(2x)'; }
                        else if (eff === 0.5) { effColor = '#cbd5e1'; effText = '(0.5x)'; }
                        else if (eff <= 0.25 && eff > 0) { effColor = '#94a3b8'; effText = '(0.25x)'; }
                        else if (eff === 0) { effColor = '#475569'; effText = '(0x)'; }
                    }
                    let fxText = m.effects && m.effects.desc ? `<div style="font-size:0.65rem; color: rgba(255,255,255,0.8); margin-top:2px; line-height:1;">${m.effects.desc}</div>` : '';

                    let disBtn = '';
                    let lockDisabled = false;

                    if (myActive.choiceLock && myActive.choiceLock !== moveId) {
                        lockDisabled = true;
                    }
                    if (m.category === 'Status' && (myActive.item === 'Assault Vest' || myActive.taunt > 0)) {
                        lockDisabled = true;
                    }

                    if (lockDisabled) {
                        disBtn = 'disabled style="opacity:0.3; cursor:not-allowed;"';
                    }

                    return `<button class="btn-move bg-${m.type}" ${disBtn} onclick="window.sendAction('move', '${moveId}')" style="display:flex; flex-direction:column; justify-content:center;">
                                            <div class="move-name" style="color: ${effColor}; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);">${esc(m.name)} ${effText}</div>
                                            <div class="move-meta type-${m.type}">${m.type} / Pow: ${m.power} / Acc: ${m.accuracy}</div>
                                            ${fxText}
                                        </button>`;
                }).join('')}
                            </div>
                        `}
                        
                        <div style="font-size:0.8rem; font-weight:700; margin:10px 0 4px; text-align:left;">Switch Pokémon:</div>
                <div class="switch-grid">
                    ${myTeamFull.map((p, i) => {
                    const isCurrent = i === myActiveIdx;
                    const isFainted = p.currentHp <= 0;
                    let dis = isCurrent || isFainted ? 'disabled' : '';

                    // If expecting standard turn and waiting, disable.
                    if (amIWaiting && !activeIsFainted && !state.faintReplacement) dis = 'disabled';

                    // Faint replacement phase logic: 
                    // If my Pokémon DID NOT faint, I am completely disabled during this phase (waiting for opponent to switch).
                    if (state.faintReplacement) {
                        if (!activeIsFainted) dis = 'disabled';
                        else if (state.actions[currentUser.uid]) dis = 'disabled'; // I already picked my replacement
                    }

                    return `<div style="display:flex; align-items:center; gap:4px; width:100%;">
                                    <button class="btn-switch" style="flex:1;" ${dis} onclick="window.sendAction('switch', ${i})">
                                        <img src="${p.sprite}">
                                        <div style="text-align:left;">
                                            <div style="font-weight:700; font-size:0.75rem;">${esc(p.name)}</div>
                                            <div class="sub">${p.currentHp}/${p.hp} HP ${isFainted ? '(FAINTED)' : ''}</div>
                                        </div>
                                    </button>
                                    <button class="btn btn-sm" style="padding:4px 6px; background:var(--card-hover); font-size:0.75rem; min-width:28px;" onclick="window.showBenchInfo('${myUid}', ${i})">ℹ️</button>
                                </div>`;
                }).join('')}
                </div>
                    </div>
                <div style="text-align:right; margin-top:15px; padding-top:15px; border-top:1px solid rgba(255,255,255,0.1);">
                    <button class="btn btn-sm" style="background:var(--card-hover);" onclick="window.surrenderMatch()">Surrender</button>
                </div>
            `;

            // Auto-scroll log to bottom
            setTimeout(() => {
                const bLog = document.getElementById('b-log');
                if (bLog) bLog.scrollTop = bLog.scrollHeight;
            }, 50);

            return html;
        }

    </script>
</body>

</html>
