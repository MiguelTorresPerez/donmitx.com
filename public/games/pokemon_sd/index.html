<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Showdown - Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.85);
            --card-hover: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #eab308;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: transparent;
            color: var(--text);
            padding: 10px 20px;
            overflow-x: hidden;
        }

        .game-wrapper {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        /* UI Elements */
        .setting-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .setting-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .setting-group select {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .warning-text {
            color: var(--danger);
            font-size: 0.8rem;
            margin-top: 6px;
            font-weight: 600;
            display: none;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: var(--success);
        }

        .btn-success:hover:not(:disabled) {
            background: #059669;
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover:not(:disabled) {
            background: #dc2626;
        }

        /* Team Builder */
        .pokemon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .pokemon-grid::-webkit-scrollbar {
            width: 6px;
        }

        .pokemon-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .pokemon-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }

        .pokemon-card:hover {
            border-color: var(--primary);
        }

        .pokemon-card.selected {
            background: rgba(59, 130, 246, 0.3);
            border-color: var(--primary);
        }

        .pokemon-card img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .pokemon-card .name {
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 4px;
        }

        .team-slots {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            justify-content: center;
        }

        .slot {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .slot.filled {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.2);
        }

        /* Battle Scene */
        .battle-scene {
            position: relative;
            width: 100%;
            height: 320px;
            background: linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 16px;
        }

        .platform {
            position: absolute;
            width: 220px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            transform: scaleY(0.5);
            border: 2px solid rgba(255, 255, 255, 0.05);
        }

        .platform.opponent {
            top: 70px;
            right: 20px;
        }

        .platform.player {
            bottom: 40px;
            left: -10px;
            width: 260px;
            height: 80px;
        }

        .sprite {
            position: absolute;
            transform-origin: bottom center;
            transition: all 0.3s;
            z-index: 5;
            image-rendering: pixelated;
        }

        .sprite.opponent {
            width: 120px;
            height: 120px;
            right: 70px;
            top: 40px;
        }

        .sprite.player {
            width: 160px;
            height: 160px;
            left: 40px;
            bottom: 60px;
        }

        .fainted {
            opacity: 0;
            transform: translateY(50px) scale(0.8) !important;
        }

        /* Animations */
        @keyframes attack {
            0% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(30px);
            }

            100% {
                transform: translateX(0);
            }
        }

        @keyframes hit {
            0% {
                filter: brightness(1);
                transform: translateX(0);
            }

            20% {
                filter: brightness(2) opacity(0.5);
                transform: translateX(-5px);
            }

            40% {
                filter: brightness(1);
                transform: translateX(5px);
            }

            60% {
                filter: brightness(2) opacity(0.5);
                transform: translateX(-5px);
            }

            80% {
                filter: brightness(1);
                transform: translateX(5px);
            }

            100% {
                filter: brightness(1);
                transform: translateX(0);
            }
        }

        .anim-attack-p1 {
            animation: attack 0.4s ease-in-out;
        }

        .anim-attack-p2 {
            animation: attack 0.4s ease-in-out reverse;
        }

        .anim-hit {
            animation: hit 0.5s linear;
        }

        /* HP Bars */
        .hud {
            position: absolute;
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 200px;
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .hud.opponent {
            top: 20px;
            left: 20px;
            border-top: 3px solid var(--danger);
        }

        .hud.player {
            bottom: 20px;
            right: 20px;
            border-top: 3px solid var(--primary);
        }

        .hud-name {
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .hud-name .level {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .hp-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.5s ease-in-out, background-color 0.5s;
        }

        .hp-text {
            font-size: 0.7rem;
            text-align: right;
            margin-top: 4px;
            font-weight: 600;
            font-family: monospace;
        }

        /* Status Ailments */
        .status-badge {
            font-size: 0.6rem;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
            margin-left: 6px;
        }

        .status-par {
            background: #eab308;
            color: black;
        }

        .status-brn {
            background: #ef4444;
            color: white;
        }

        .status-psn {
            background: #a855f7;
            color: white;
        }

        .status-slp {
            background: #94a3b8;
            color: white;
        }

        /* Controls */
        .battle-controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .move-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-move {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }

        .btn-move:hover:not(:disabled) {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--primary);
        }

        .btn-move.selected {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-move .move-name {
            font-weight: 700;
            font-size: 0.85rem;
        }

        .btn-move .move-meta {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 2px;
        }

        /* Type Colors & Backgrounds */
        .type-Normal {
            color: #a8a29e;
        }

        .bg-Normal {
            background-color: rgba(168, 162, 158, 0.3) !important;
            border-color: #a8a29e !important;
        }

        .type-Fire {
            color: #f87171;
        }

        .bg-Fire {
            background-color: rgba(248, 113, 113, 0.3) !important;
            border-color: #f87171 !important;
        }

        .type-Water {
            color: #60a5fa;
        }

        .bg-Water {
            background-color: rgba(96, 165, 250, 0.3) !important;
            border-color: #60a5fa !important;
        }

        .type-Electric {
            color: #facc15;
        }

        .bg-Electric {
            background-color: rgba(250, 204, 21, 0.3) !important;
            border-color: #facc15 !important;
        }

        .type-Grass {
            color: #4ade80;
        }

        .bg-Grass {
            background-color: rgba(74, 222, 128, 0.3) !important;
            border-color: #4ade80 !important;
        }

        .type-Ice {
            color: #67e8f9;
        }

        .bg-Ice {
            background-color: rgba(103, 232, 249, 0.3) !important;
            border-color: #67e8f9 !important;
        }

        .type-Fighting {
            color: #f43f5e;
        }

        .bg-Fighting {
            background-color: rgba(244, 63, 94, 0.3) !important;
            border-color: #f43f5e !important;
        }

        .type-Poison {
            color: #c084fc;
        }

        .bg-Poison {
            background-color: rgba(192, 132, 252, 0.3) !important;
            border-color: #c084fc !important;
        }

        .type-Ground {
            color: #d97706;
        }

        .bg-Ground {
            background-color: rgba(217, 119, 6, 0.3) !important;
            border-color: #d97706 !important;
        }

        .type-Flying {
            color: #818cf8;
        }

        .bg-Flying {
            background-color: rgba(129, 140, 248, 0.3) !important;
            border-color: #818cf8 !important;
        }

        .type-Psychic {
            color: #fb7185;
        }

        .bg-Psychic {
            background-color: rgba(251, 113, 133, 0.3) !important;
            border-color: #fb7185 !important;
        }

        .type-Bug {
            color: #a3e635;
        }

        .bg-Bug {
            background-color: rgba(163, 230, 53, 0.3) !important;
            border-color: #a3e635 !important;
        }

        .type-Rock {
            color: #b45309;
        }

        .bg-Rock {
            background-color: rgba(180, 83, 9, 0.3) !important;
            border-color: #b45309 !important;
        }

        .type-Ghost {
            color: #8b5cf6;
        }

        .bg-Ghost {
            background-color: rgba(139, 92, 246, 0.3) !important;
            border-color: #8b5cf6 !important;
        }

        .type-Dragon {
            color: #818cf8;
        }

        /* Should be different from flying but keeps the existing color */
        .bg-Dragon {
            background-color: rgba(129, 140, 248, 0.3) !important;
            border-color: #818cf8 !important;
        }

        .type-Dark {
            color: #475569;
        }

        .bg-Dark {
            background-color: rgba(71, 85, 105, 0.3) !important;
            border-color: #475569 !important;
        }

        .type-Steel {
            color: #94a3b8;
        }

        .bg-Steel {
            background-color: rgba(148, 163, 184, 0.3) !important;
            border-color: #94a3b8 !important;
        }

        .type-Fairy {
            color: #f472b6;
        }

        .bg-Fairy {
            background-color: rgba(244, 114, 182, 0.3) !important;
            border-color: #f472b6 !important;
        }

        /* Battle Log */
        .battle-log {
            height: 120px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            line-height: 1.4;
            color: #cbd5e1;
        }

        .battle-log p {
            margin-bottom: 4px;
        }

        .battle-log .super {
            color: var(--warning);
            font-weight: bold;
        }

        .battle-log .notvery {
            color: var(--text-muted);
            font-style: italic;
        }

        .battle-log .crit {
            color: var(--danger);
            font-weight: bold;
        }

        .battle-log .fainted-text {
            color: var(--danger);
            text-transform: uppercase;
        }

        .battle-log .item-text {
            color: var(--success);
            font-style: italic;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal {
            background: var(--bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius);
            padding: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .move-picker-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        /* Switch Menu */
        .switch-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-switch {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-switch:hover:not(:disabled) {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--success);
        }

        .btn-switch.selected {
            background: var(--success);
            border-color: var(--success);
        }

        .btn-switch img {
            width: 30px;
            height: 30px;
            margin-right: 8px;
        }

        .btn-switch .sub {
            font-size: 0.65rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="game-wrapper">
        <div class="header">
            <h1>Showdown Engine</h1>
            <p class="subtitle" id="room-code">Connecting...</p>
        </div>
        <div id="game-area" style="text-align: center;">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Active Pokémon Info Modal -->
    <div class="modal-overlay" id="modal-mon-info" style="display:none; z-index:9999;">
        <div class="modal" id="mon-info-content">
            <!-- Injected dynamically -->
        </div>
    </div>

    <!-- Move Info Modal -->
    <div class="modal-overlay" id="modal-move-info" style="display:none; z-index:10000;">
        <div class="modal" id="move-info-content">
            <!-- Injected dynamically -->
        </div>
    </div>

    <!-- AUDIO ELEMENTS -->
    <!-- (Optional: you can dynamically create Audio objects, omitted here for brevity) -->

    <script type="module">
        import { POKEMON_DB, FORMATS, MOVES, TYPE_CHART, getEffectiveness, ITEMS } from './data.js';

        if (!window.parent.DONMITX_GAME_API) {
            document.getElementById('game-area').innerHTML = '<p class="warning-text" style="display:block">Error: Must be played from Dashboard.</p>';
            throw new Error("Game API missing");
        }

        const { db, auth, doc, onSnapshot, updateDoc: _updateDoc } = window.parent.DONMITX_GAME_API;

        const updateDoc = async (ref, data) => {
            const pureData = window.parent.JSON.parse(JSON.stringify(data));
            return _updateDoc(ref, pureData);
        };

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId');

        if (!roomId) throw new Error("No roomId");

        let currentUser = null;
        let roomRef = doc(db, 'game_rooms', roomId);
        let roomState = null;

        // Local state
        let myTeam = [];
        let p1Uid = null;
        let p2Uid = null;

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                initGame();
            } else {
                document.getElementById('game-area').innerHTML = '<p class="warning-text" style="display:block">Please log in.</p>';
            }
        });

        function initGame() {
            document.getElementById('room-code').textContent = `Room ID: ${roomId.substring(0, 6).toUpperCase()}`;

            onSnapshot(roomRef, (snapshot) => {
                if (!snapshot.exists()) return;

                const prevState = roomState?.status;
                const prevTurn = roomState?.state?.turn;
                roomState = snapshot.data();

                const playerIds = Object.keys(roomState.players || {});
                if (playerIds.length === 2 && !p1Uid) {
                    p1Uid = roomState.hostUid;
                    p2Uid = playerIds.find(id => id !== p1Uid);
                }

                render();

                // State progression logic (Host only)
                if (isHost()) {
                    if (roomState.status === 'teambuilder') {
                        const allReady = playerIds.length === 2 && playerIds.every(id => roomState.players[id].teamReady);
                        if (allReady) initBattleState();
                    } else if (roomState.status === 'playing') {
                        const s = roomState.state;
                        // Turn Execution Phase
                        if (s && s.actions && !s.resolving) {
                            if (s.faintReplacement) {
                                // Only need actions from players with fainted mons
                                const activeIdx = s.active;
                                const p1Mon = roomState.players[p1Uid].team[activeIdx[p1Uid]];
                                const p2Mon = roomState.players[p2Uid].team[activeIdx[p2Uid]];

                                const p1NeedsAction = p1Mon.currentHp <= 0 && !s.actions[p1Uid];
                                const p2NeedsAction = p2Mon.currentHp <= 0 && !s.actions[p2Uid];

                                if (!p1NeedsAction && !p2NeedsAction) {
                                    executeTurn();
                                }
                            } else {
                                // Normal turn: need actions from both
                                if (s.actions[p1Uid] && s.actions[p2Uid]) {
                                    executeTurn();
                                }
                            }
                        }
                    }
                }
            });
        }

        function isHost() { return currentUser && roomState && roomState.hostUid === currentUser.uid; }
        function esc(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

        function render() {
            try {
                const area = document.getElementById('game-area');
                const isPlayer = !!(roomState.players && roomState.players[currentUser.uid]);

                if (roomState.status === 'lobby') area.innerHTML = renderLobby();
                else if (roomState.status === 'teambuilder') {
                    if (!isPlayer) area.innerHTML = '<div class="card"><h2>Spectating</h2><p class="text-muted">Waiting for players to build their teams...</p><div class="spinner"></div></div>';
                    else area.innerHTML = renderTeamBuilder();
                }
                else if (roomState.status === 'playing') area.innerHTML = renderBattle();
                else area.innerHTML = '<p>Game finished.</p>';
            } catch (err) {
                console.error("Render Error:", err);
                document.getElementById('game-area').innerHTML = `
                    <div style="color:var(--danger); text-align:left; background:rgba(255,0,0,0.1); padding:10px; border-radius:8px;">
                        <b>[Debug Error]</b> ${esc(err.message)}<br/>
                        <span style="font-size:0.7rem;">${esc(err.stack)}</span>
                    </div>
                `;
            }
        }

        // ------------------
        // LOBBY & FORMAT
        // ------------------

        window.handleFormatChange = function (e) {
            const format = FORMATS.find(f => f.id === e.value);
            const warningEl = document.getElementById('format-warning');
            if (format && format.warning) {
                warningEl.textContent = format.warning;
                warningEl.style.display = 'block';
            } else {
                warningEl.style.display = 'none';
            }
        }

        window.startTeamBuilder = async function () {
            const formatId = document.getElementById('setting-format').value;
            const format = FORMATS.find(f => f.id === formatId);
            await updateDoc(roomRef, {
                status: 'teambuilder',
                'state.format': { id: format.id, name: format.name },
                ...Object.fromEntries(Object.keys(roomState.players).map(uid => [`players.${uid}.teamReady`, false])),
                ...Object.fromEntries(Object.keys(roomState.players).map(uid => [`players.${uid}.team`, []]))
            });
        }

        window.getSmartMoves = function (p) {
            let available = p.moves.map(id => ({ id, ...MOVES[id] })).filter(m => m.name);
            available.forEach(m => {
                let score = m.power || 0;
                if (p.types.includes(m.type) && m.category !== 'Status') score *= 1.5;
                if (m.priority > 0) score += 30;
                if (m.accuracy < 100) score *= (m.accuracy / 100);
                if (m.category === 'Status') score = 40;
                if (['Swords Dance', 'Dragon Dance', 'Nasty Plot', 'Calm Mind'].includes(m.name)) score += 80;
                m.score = score + Math.random() * 20;
            });
            available.sort((a, b) => b.score - a.score);

            let selected = [];
            let coveredTypes = new Set();
            for (let m of available) {
                if (selected.length === 4) break;
                if (m.category !== 'Status' && coveredTypes.has(m.type) && selected.length >= 2) continue;
                selected.push(m.id);
                if (m.category !== 'Status') coveredTypes.add(m.type);
            }
            while (selected.length < 4) {
                let fallback = available.find(m => !selected.includes(m.id))?.id || 'struggle';
                selected.push(fallback);
            }
            return selected;
        }

        // Action Submitter
        window.sendAction = async function (type, val) {
            const hasSent = roomState.state.actions[currentUser.uid];
            if (hasSent || roomState.state.resolving) return;

            // Optimistic UI freeze
            document.querySelectorAll('.btn-move, .btn-switch').forEach(b => b.disabled = true);

        window.surrenderMatch = async function () {
            if (!currentUser) return;
            if (!confirm("Are you sure you want to forfeit the match?")) return;

            const uids = Object.keys(roomState.players || {});
            const oppUid = uids.find(id => id !== currentUser.uid);
            if (!oppUid) return;
            let log = [...(roomState.state?.log || [])];
            log.push(`${roomState.players[currentUser.uid].name} forfeited the match!`);
            log.push(`${roomState.players[oppUid].name} wins the battle!`);

            await updateDoc(roomRef, {
                status: 'finished',
                'state.log': log
            });
        };

        // Core Turn Logic (Host side)
        async function executeTurn() {
            await updateDoc(roomRef, { 'state.resolving': true });

            const state = roomState.state;
            const actions = state.actions;
            let log = [...(state.log || [])];

            const teams = { [p1Uid]: roomState.players[p1Uid].team, [p2Uid]: roomState.players[p2Uid].team };
            const activeIdx = { ...state.active };
            const getMon = (uid) => teams[uid][activeIdx[uid]];

            // 0. Handle Faint Replacement Phase
            if (state.faintReplacement) {
                let allReplacementsDone = true;

                for (const uid of [p1Uid, p2Uid]) {
                    if (getMon(uid).currentHp <= 0) {
                        if (actions[uid] && actions[uid].type === 'switch') {
                            const oldMon = getMon(uid);
                            oldMon.boosts = { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, accuracy: 0, evasion: 0 };
                            oldMon.choiceLock = null;

                            const newIdx = actions[uid].val;
                            activeIdx[uid] = newIdx;
                            log.push(`${roomState.players[uid].name} sent out ${getMon(uid).name}!`);
                        } else {
                            allReplacementsDone = false;
                        }
                    }
                }

                if (!allReplacementsDone) {
                    await updateDoc(roomRef, { 'state.resolving': false });
                    return; // Wait for the other player to pick
                }

                await updateDoc(roomRef, {
                    'state.resolving': false,
                    'state.actions': {},
                    'state.faintReplacement': false,
                    'state.log': log,
                    'state.active': activeIdx,
                    [`players.${p1Uid}.team`]: teams[p1Uid],
                    [`players.${p2Uid}.team`]: teams[p2Uid]
                });
                return;
            }

            // 1. Resolve Switches first (Priority 6)
            for (const uid of [p1Uid, p2Uid]) {
                if (actions[uid].type === 'switch') {
                    const oldMon = getMon(uid);
                    oldMon.boosts = { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, accuracy: 0, evasion: 0 };
                    oldMon.choiceLock = null;
                    oldMon.seeded = false;
                    oldMon.taunt = 0;
                    oldMon.encore = 0;
                    oldMon.substituteHp = 0;
                    oldMon.perishSong = 0;
                    oldMon.destinyBond = false;
                    oldMon.hasBeenSwitchedOut = true; // For Zero to Hero (Palafin)

                    const newIdx = actions[uid].val;
                    activeIdx[uid] = newIdx;
                    log.push(`${roomState.players[uid].name} withdrew their Pokémon and sent out ${getMon(uid).name}!`);

                    // Apply Healing Wish if active
                    if (state.healingWish && state.healingWish[uid]) {
                        const newMon = getMon(uid);
                        newMon.currentHp = newMon.hp;
                        newMon.status = null;
                        log.push(`<span class="item-text">The healing wish came true for ${newMon.name}!</span>`);
                        state.healingWish[uid] = false;
                    }

                    // Apply Hazards
                    const newMon = getMon(uid);
                    const hazards = state.hazards[uid] || {};
                    if (newMon.item !== 'Heavy-Duty Boots') {
                        if (hazards['stealth-rock']) {
                            const eff = getEffectiveness('Rock', newMon.types);
                            const dmg = Math.floor(newMon.hp * (0.125 * eff)) || 1;
                            newMon.currentHp = Math.max(0, newMon.currentHp - dmg);
                            log.push(`> Pointed stones dug into ${newMon.name}!`);
                        }
                        if (hazards['spikes'] && !newMon.types.includes('Flying') && newMon.ability !== 'Levitate' && newMon.item !== 'Air Balloon') {
                            const spikesLayers = hazards['spikes'];
                            const dmg = Math.floor(newMon.hp * (spikesLayers === 1 ? 0.125 : spikesLayers === 2 ? 0.166 : 0.25)) || 1;
                            newMon.currentHp = Math.max(0, newMon.currentHp - dmg);
                            log.push(`> ${newMon.name} was hurt by spikes!`);
                        }
                        if (hazards['toxic-spikes'] && !newMon.types.includes('Flying') && newMon.ability !== 'Levitate' && newMon.item !== 'Air Balloon') {
                            if (newMon.types.includes('Poison')) {
                                hazards['toxic-spikes'] = 0;
                                log.push(`> The toxic spikes disappeared from the ground around ${roomState.players[uid].name}'s team!`);
                            } else if (!newMon.status && !newMon.types.includes('Steel')) {
                                newMon.status = hazards['toxic-spikes'] > 1 ? 'TOX' : 'PSN';
                                if (newMon.status === 'TOX') newMon.toxicCounter = 1;
                                log.push(`<span class="status-${newMon.status}">${newMon.name} was poisoned by toxic spikes!</span>`);
                            }
                        }
                        if (hazards['sticky-web'] && !newMon.types.includes('Flying') && newMon.ability !== 'Levitate' && newMon.item !== 'Air Balloon') {
                            newMon.boosts.spe = Math.max(-6, newMon.boosts.spe - 1);
                            log.push(`<span class="notvery">${newMon.name} was caught in a sticky web!</span>`);
                        }
                    }
                    if (newMon.currentHp === 0) log.push(`<span class="fainted-text">${newMon.name} fainted!</span>`);

                    // Ability triggers on switch-in
                    if (newMon.currentHp > 0) {
                        const oppUid = uid === p1Uid ? p2Uid : p1Uid;
                        const oppMon = getMon(oppUid);
                        const ab = (newMon.ability || '').toLowerCase().replace(/\s+/g, '');

                        // Intimidate
                        if (ab === 'intimidate' && oppMon.currentHp > 0) {
                            oppMon.boosts.atk = Math.max(-6, oppMon.boosts.atk - 1);
                            log.push(`<span class="notvery">${newMon.name}'s Intimidate lowered ${oppMon.name}'s Attack!</span>`);
                        }
                        // Weather abilities
                        if (ab === 'drizzle') { state.weather = 'Rain'; state.weatherTurns = 5; log.push(`> ${newMon.name}'s Drizzle made it rain!`); }
                        if (ab === 'drought') { state.weather = 'Sun'; state.weatherTurns = 5; log.push(`> ${newMon.name}'s Drought intensified the sun!`); }
                        if (ab === 'sandstream') { state.weather = 'Sand'; state.weatherTurns = 5; log.push(`> ${newMon.name}'s Sand Stream whipped up a sandstorm!`); }
                        if (ab === 'snowwarning') { state.weather = 'Snow'; state.weatherTurns = 5; log.push(`> ${newMon.name}'s Snow Warning made it snow!`); }

                        // Zero to Hero: Palafin morphs to Hero form on switch-in if it has been switched out at least once
                        if (ab === 'zerotohero' && newMon.hasBeenSwitchedOut) {
                            const heroForm = POKEMON_DB.find(p => p.id === 'palafinhero');
                            if (heroForm && newMon.id !== 'palafinhero') {
                                newMon.name = heroForm.name;
                                newMon.id = heroForm.id;
                                newMon.types = [...heroForm.types];
                                newMon.atk = heroForm.atk;
                                newMon.def = heroForm.def;
                                newMon.spa = heroForm.spa;
                                newMon.spd = heroForm.spd;
                                newMon.spe = heroForm.spe;
                                newMon.sprite = heroForm.sprite;
                                newMon.spriteBack = heroForm.spriteBack;
                                log.push(`> <span style="color:var(--accent)">${newMon.name} underwent a heroic transformation!</span>`);
                            }
                        }

                        // Forecast: Castform changes based on weather
                        if (ab === 'forecast' && (newMon.id.includes('castform') || newMon.name === 'Castform')) {
                            let targetId = 'castform';
                            if (state.weather === 'Sun') targetId = 'castformsunny';
                            else if (state.weather === 'Rain') targetId = 'castformrainy';
                            else if (state.weather === 'Snow') targetId = 'castformsnowy';

                            if (newMon.id !== targetId) {
                                if (morphToForm(newMon, targetId)) {
                                    log.push(`> <span style="color:var(--accent)">${newMon.name} transformed!</span>`);
                                }
                            }
                        }

                        // Flower Gift: Cherrim changes based on weather
                        if (ab === 'flowergift' && (newMon.id.includes('cherrim') || newMon.name === 'Cherrim')) {
                            const isSun = state.weather === 'Sun';
                            const targetId = isSun ? 'cherrimsunshine' : 'cherrim';
                            if (newMon.id !== targetId) {
                                if (morphToForm(newMon, targetId)) {
                                    log.push(`> <span style="color:var(--accent)">${newMon.name} transformed!</span>`);
                                }
                            }
                        }
                    }
                }
            }

            // 1.5. Mega Evolution (Priority 5.5)
            state.megaEvolved = state.megaEvolved || {};
            for (const uid of [p1Uid, p2Uid]) {
                const action = actions[uid];
                if (action.type === 'move' && action.mega && !state.megaEvolved[uid]) {
                    const mon = getMon(uid);
                    // Find the mega form
                    const megaForm = POKEMON_DB.find(p => p.isMega && p.baseSpecies === mon.id && p.requiredItem === mon.item);
                    if (megaForm) {
                        state.megaEvolved[uid] = true;

                        log.push(`> <strong>${roomState.players[uid].name}'s ${mon.name} is reacting to its ${mon.item}!</strong>`);
                        log.push(`> <span style="color:var(--accent)">${mon.name} Mega Evolved into ${megaForm.name}!</span>`);

                        // Morph the current mon to Mega form
                        mon.id = megaForm.id;
                        mon.name = megaForm.name;
                        mon.types = megaForm.types;
                        mon.ability = megaForm.abilities[0]; // Take primary mega ability
                        mon.sprite = megaForm.sprite;
                        mon.spriteBack = megaForm.spriteBack;

                        // Overwrite base stats
                        mon.stats = {
                            atk: megaForm.atk,
                            def: megaForm.def,
                            spa: megaForm.spa,
                            spd: megaForm.spd,
                            spe: megaForm.spe
                        };

                        // Trigger Mega Ability on switch-in
                        const oppUid = uid === p1Uid ? p2Uid : p1Uid;
                        const oppMon = getMon(oppUid);
                        const ab = (mon.ability || '').toLowerCase().replace(/\s+/g, '');
                        if (ab === 'intimidate' && oppMon.currentHp > 0) {
                            oppMon.boosts.atk = Math.max(-6, oppMon.boosts.atk - 1);
                            log.push(`<span class="notvery">${mon.name}'s Intimidate lowered ${oppMon.name}'s Attack!</span>`);
                        }
                        if (ab === 'drizzle') { state.weather = 'Rain'; state.weatherTurns = 5; log.push(`> ${mon.name}'s Drizzle made it rain!`); }
                        if (ab === 'drought') { state.weather = 'Sun'; state.weatherTurns = 5; log.push(`> ${mon.name}'s Drought intensified the sun!`); }
                        if (ab === 'sandstream') { state.weather = 'Sand'; state.weatherTurns = 5; log.push(`> ${mon.name}'s Sand Stream whipped up a sandstorm!`); }
                        if (ab === 'snowwarning') { state.weather = 'Snow'; state.weatherTurns = 5; log.push(`> ${mon.name}'s Snow Warning made it snow!`); }
                    }
                }
            }

            // 2. Determine Attack Order based on Priority and Speed
            let attackers = [];
            for (const uid of [p1Uid, p2Uid]) {
                const mon = getMon(uid);
                if (actions[uid].type === 'move' && mon.currentHp > 0) {
                    const move = MOVES[actions[uid].val];

                    if (mon.recharging) {
                        log.push(`${mon.name} must recharge!`);
                        mon.recharging = false;
                        continue;
                    }

                    // 2-turn move handling (Fly, Bounce, Dig, etc.)
                    if (move.effects && move.effects.twoTurn) {
                        // Skip charge turn for Solar Beam/Blade in Sun
                        const skipCharge = (move.name === 'Solar Beam' || move.name === 'Solar Blade') && state.weather === 'Sun';

                        if (!mon.charging && !skipCharge) {
                            mon.charging = actions[uid].val;
                            const invulnMoves = ['Fly', 'Bounce', 'Dig', 'Dive', 'Phantom Force', 'Shadow Force', 'Sky Drop'];
                            if (invulnMoves.includes(move.name)) {
                                mon.semiInvulnerable = true;
                            }
                            log.push(`> ${mon.name} is charging up ${move.name}!`);
                            // Apply charge-turn boosts (Meteor Beam)
                            if (move.effects.selfBoost) {
                                for (const [s, amt] of Object.entries(move.effects.selfBoost)) {
                                    mon.boosts[s] = Math.max(-6, Math.min(6, mon.boosts[s] + amt));
                                }
                                log.push(`> ${mon.name}'s stats changed!`);
                            }
                            continue;
                        }
                        // Attack turn - clear charging state
                        mon.charging = null;
                        mon.semiInvulnerable = false;
                    }

                    // Paralyze skip
                    if (mon.status === 'PAR' && Math.random() < 0.25) {
                        log.push(`${mon.name} is fully paralyzed!`);
                        continue;
                    }
                    // Sleep skip (counter-based, 1-3 turns)
                    if (mon.status === 'SLP') {
                        if (mon.sleepTurns !== undefined && mon.sleepTurns > 0) {
                            mon.sleepTurns--;
                            if (mon.sleepTurns <= 0) {
                                mon.status = null;
                                log.push(`${mon.name} woke up!`);
                            } else {
                                log.push(`${mon.name} is fast asleep.`);
                                continue;
                            }
                        } else {
                            mon.sleepTurns = 1 + Math.floor(Math.random() * 3);
                            log.push(`${mon.name} is fast asleep.`);
                            continue;
                        }
                    }
                    // Freeze skip (20% thaw, or thaw if using Fire move)
                    if (mon.status === 'FRZ') {
                        if (move.type === 'Fire' || Math.random() < 0.2) {
                            mon.status = null;
                            log.push(`${mon.name} thawed out!`);
                        } else {
                            log.push(`${mon.name} is frozen solid!`);
                            continue;
                        }
                    }

                    // Taunt & Encore Check
                    if (mon.taunt > 0 && move.category === 'Status') {
                        log.push(`${mon.name} can't use ${move.name} after the taunt!`);
                        continue;
                    }

                    // Stat calculation function with boosts
                    const calcStat = (base, boost) => {
                        if (boost >= 0) return Math.floor(base * ((2 + boost) / 2));
                        return Math.floor(base * (2 / (2 - boost)));
                    };

                    let speed = calcStat(mon.spe, mon.boosts.spe);
                    if (mon.item === 'Choice Scarf') speed = Math.floor(speed * 1.5);
                    if (mon.status === 'PAR') speed = Math.floor(speed * 0.5);

                    let priority = move.priority || 0;
                    if (mon.ability === 'Prankster' && move.category === 'Status') priority += 1;

                    attackers.push({ uid, mon, move, priority, speed });
                }
            }

            attackers.sort((a, b) => {
                if (b.priority !== a.priority) return b.priority - a.priority;
                if (b.speed !== a.speed) return b.speed - a.speed;
                return Math.random() > 0.5 ? 1 : -1;
            });

            // 3. Execute Attacks
            let matchOver = false;

            // Helper: morph a pokemon to a different form by looking up POKEMON_DB
            const morphToForm = (mon, formId) => {
                const form = POKEMON_DB.find(p => p.id === formId);
                if (!form) return false;
                mon.name = form.name;
                mon.id = form.id;
                mon.types = [...form.types];
                mon.ability = form.abilities?.[0] || mon.ability;
                mon.atk = form.atk;
                mon.def = form.def;
                mon.spa = form.spa;
                mon.spd = form.spd;
                mon.spe = form.spe;
                mon.sprite = form.sprite;
                mon.spriteBack = form.spriteBack;
                return true;
            };

            for (const atkData of attackers) {
                const { uid, mon, move } = atkData;
                const defUid = uid === p1Uid ? p2Uid : p1Uid;
                const defMon = getMon(defUid);

                if (mon.currentHp <= 0) continue;

                // --- PRE-ATTACK FORM CHANGES ---
                // Stance Change: Aegislash
                if (mon.ability === 'Stance Change') {
                    if (move.category !== 'Status' && (mon.id === 'aegislash' || mon.id === 'aegislash-shield' || mon.id.includes('aegislash') && !mon.id.includes('blade'))) {
                        morphToForm(mon, 'aegislashblade');
                        log.push(`> <span style="color:var(--accent)">${mon.name} changed to Blade Forme!</span>`);
                    } else if (move.effects && move.effects.protect && (mon.id === 'aegislashblade' || mon.id.includes('blade'))) {
                        morphToForm(mon, 'aegislash-shield');
                        if (!POKEMON_DB.find(p => p.id === 'aegislash-shield')) morphToForm(mon, 'aegislash');
                        log.push(`> <span style="color:var(--accent)">${mon.name} changed to Shield Forme!</span>`);
                    }
                }

                log.push(`${mon.name} used ${move.name}!`);

                if (mon.item && mon.item.startsWith('Choice ') && !mon.choiceLock) {
                    mon.choiceLock = actions[uid].val;
                }

                const calcStat = (base, boost) => boost >= 0 ? Math.floor(base * ((2 + boost) / 2)) : Math.floor(base * (2 / (2 - boost)));

                // --- PROTECT LOGIC ---
                if (move.effects && move.effects.protect) {
                    if (mon.protectLastTurn) {
                        if (Math.random() < 0.5) { log.push(`> But it failed!`); continue; }
                    }
                    mon.protecting = true;
                    mon.protectLastTurn = true;
                    log.push(`> ${mon.name} protected itself!`);
                    continue;
                }

                // --- WEATHER LOGIC ---
                if (move.effects && move.effects.weather) {
                    state.weather = move.effects.weather;
                    state.weatherTurns = 5;
                    const wNames = { Sun: 'harsh sunlight', Rain: 'rain', Sand: 'a sandstorm', Snow: 'snow' };
                    log.push(`> The weather changed to ${wNames[move.effects.weather] || move.effects.weather}!`);
                    continue;
                }

                // --- CHECK IF DEFENDER IS PROTECTING ---
                if (defMon.protecting && defMon.currentHp > 0 && move.category !== 'Status') {
                    log.push(`> ${defMon.name} protected itself!`);
                    const defFx = defMon._protectFx;
                    if (defFx) {
                        if (defFx.protectDamage && mon.currentHp > 0) {
                            const pd = Math.floor(mon.hp * defFx.protectDamage) || 1;
                            mon.currentHp = Math.max(0, mon.currentHp - pd);
                            log.push(`> ${mon.name} was hurt!`);
                        }
                        if (defFx.protectDrop) {
                            for (const [s, a] of Object.entries(defFx.protectDrop)) {
                                mon.boosts[s] = Math.max(-6, Math.min(6, mon.boosts[s] + a));
                            }
                            log.push(`> ${mon.name}'s stats fell!`);
                        }
                        if (defFx.protectStatus && !mon.status && mon.currentHp > 0) {
                            mon.status = defFx.protectStatus;
                            log.push(`> ${mon.name} was afflicted with ${defFx.protectStatus}!`);
                        }
                    }
                    continue;
                }

                // --- ACCURACY CHECK ---
                if (defMon.currentHp > 0) {
                    // Semi-invulnerable Counters
                    let bypassedInvulnerability = false;
                    let doubleDamageInvulnerable = false;

                    if (defMon.semiInvulnerable) {
                        const stateCauser = defMon.charging; // The move that caused it (e.g. "Fly", "Dig", "Dive")
                        const mName = move.name;

                        // Fly / Bounce counters
                        if ((stateCauser === 'Fly' || stateCauser === 'Bounce' || stateCauser === 'Sky Drop') &&
                            ['Gust', 'Twister', 'Thunder', 'Hurricane', 'Sky Uppercut', 'Smack Down'].includes(mName)) {
                            bypassedInvulnerability = true;
                            if (mName === 'Gust' || mName === 'Twister') doubleDamageInvulnerable = true;
                        }
                        // Dig counters
                        else if (stateCauser === 'Dig' && ['Earthquake', 'Magnitude'].includes(mName)) {
                            bypassedInvulnerability = true;
                            if (mName === 'Earthquake' || mName === 'Magnitude') doubleDamageInvulnerable = true;
                        }
                        // Dive counters
                        else if (stateCauser === 'Dive' && ['Surf', 'Whirlpool'].includes(mName)) {
                            bypassedInvulnerability = true;
                            if (mName === 'Surf' || mName === 'Whirlpool') doubleDamageInvulnerable = true;
                        }
                        // Phantom Force / Shadow Force bypass Protect, but have no specific move counters here

                        if (!bypassedInvulnerability) {
                            // Standard miss against semi-invulnerable
                            log.push(`> ${mon.name}'s attack missed! ${defMon.name} is semi-invulnerable.`);
                            continue;
                        } else {
                            log.push(`> ${mon.name} caught ${defMon.name} during its vulnerability!`);
                        }
                    }

                    // Accuracy bypass in specific Weather
                    let skipsAccuracy = false;
                    if (state.weather === 'Rain' && ['Thunder', 'Hurricane'].includes(move.name)) skipsAccuracy = true;
                    if (state.weather === 'Snow' && move.name === 'Blizzard') skipsAccuracy = true;

                    if (!skipsAccuracy && move.accuracy && move.accuracy < 100) {
                        let accStage = (mon.boosts.accuracy || 0) - (defMon.boosts.evasion || 0);
                        accStage = Math.max(-6, Math.min(6, accStage));
                        const accMul = accStage >= 0 ? (3 + accStage) / 3 : 3 / (3 - accStage);
                        const finalAcc = move.accuracy * accMul;
                        if (Math.random() * 100 > finalAcc) {
                            log.push(`> ${mon.name}'s attack missed!`);
                            continue;
                        }
                    }
                }

                // --- DAMAGING MOVES ---
                if (defMon.currentHp > 0 && move.category !== 'Status') {
                    const level = 100;
                    const isChoiceBand = mon.item === 'Choice Band' && move.category === 'Physical' ? 1.5 : 1;
                    const isChoiceSpecs = mon.item === 'Choice Specs' && move.category === 'Special' ? 1.5 : 1;
                    const isLifeOrb = mon.item === 'Life Orb' ? 1.3 : 1;

                    // Reflect / Light Screen / Aurora Veil
                    let isCrit = false;
                    let defMod = 1;
                    let spdMod = 1;

                    // Crits
                    if (Math.random() < (move.critRate ? 0.12 : 0.04)) isCrit = true;

                    if (state.screens[defUid]) {
                        if (state.screens[defUid]['reflect'] && move.category === 'Physical' && !isCrit) defMod *= 2;
                        if (state.screens[defUid]['light-screen'] && move.category === 'Special' && !isCrit) spdMod *= 2;
                        if (state.screens[defUid]['aurora-veil'] && !isCrit) { defMod *= 2; spdMod *= 2; }
                    }

                    // Eviolite / Assault Vest
                    if (defMon.item === 'Eviolite') { defMod *= 1.5; spdMod *= 1.5; } // Simplified NFE check
                    if (defMon.item === 'Assault Vest') { spdMod *= 1.5; }

                    let calcBoost = (boost, ability) => {
                        if (ability === 'Simple') boost *= 2;
                        if (ability === 'Contrary') boost *= -1;
                        return Math.max(-6, Math.min(6, boost));
                    };

                    let statA = move.category === 'Special' ?
                        calcStat(mon.spa, calcBoost(mon.boosts.spa, mon.ability)) :
                        calcStat(mon.atk, calcBoost(mon.boosts.atk, mon.ability));

                    if (mon.status === 'BRN' && move.category === 'Physical') statA = Math.floor(statA * 0.5);
                    statA = Math.floor(statA * isChoiceBand * isChoiceSpecs);

                    // Offensive Ability Modifiers
                    if (mon.ability === 'Technician' && move.power <= 60) statA = Math.floor(statA * 1.5);
                    if (mon.ability === 'Sheer Force' && move.effects && (move.effects.status || move.effects.enemyDrop || move.effects.selfBoost || move.effects.flinch)) {
                        statA = Math.floor(statA * 1.3);
                        // Sheer force removes secondary effects (handled in application phase natively by skipping, but we boost here)
                    }
                    if (mon.ability === 'Tough Claws' && move.contact) statA = Math.floor(statA * 1.3);

                    // Weather defensive boosts
                    let wDefMod = 1;
                    let wSpdMod = 1;
                    if (state.weather === 'Snow' && defMon.types.includes('Ice')) wDefMod *= 1.5;
                    if (state.weather === 'Sand' && defMon.types.includes('Rock')) wSpdMod *= 1.5;

                    let statD = move.category === 'Special' ? calcStat(defMon.spd, defMon.boosts.spd) * spdMod * wSpdMod : calcStat(defMon.def, defMon.boosts.def) * defMod * wDefMod;

                    // Ability: Immunities & Absorptions
                    let effectiveness = getEffectiveness(move.type, defMon.types);
                    if (effectiveness > 0) {
                        if (defMon.ability === 'Levitate' && move.type === 'Ground') {
                            log.push(`> ${defMon.name}'s Levitate makes it immune to Ground moves!`);
                            effectiveness = 0;
                        } else if ((defMon.ability === 'Water Absorb' || defMon.ability === 'Dry Skin') && move.type === 'Water') {
                            log.push(`> ${defMon.name}'s ${defMon.ability} absorbed the attack!`);
                            defMon.currentHp = Math.min(defMon.hp, defMon.currentHp + Math.floor(defMon.hp / 4));
                            effectiveness = 0;
                        } else if (defMon.ability === 'Volt Absorb' && move.type === 'Electric') {
                            log.push(`> ${defMon.name}'s Volt Absorb absorbed the attack!`);
                            defMon.currentHp = Math.min(defMon.hp, defMon.currentHp + Math.floor(defMon.hp / 4));
                            effectiveness = 0;
                        } else if (defMon.ability === 'Motor Drive' && move.type === 'Electric') {
                            log.push(`> ${defMon.name}'s Motor Drive raised its Speed!`);
                            defMon.boosts.spe = Math.min(6, defMon.boosts.spe + 1);
                            effectiveness = 0;
                        } else if (defMon.ability === 'Sap Sipper' && move.type === 'Grass') {
                            log.push(`> ${defMon.name}'s Sap Sipper raised its Attack!`);
                            defMon.boosts.atk = Math.min(6, defMon.boosts.atk + 1);
                            effectiveness = 0;
                        } else if (defMon.ability === 'Flash Fire' && move.type === 'Fire') {
                            log.push(`> ${defMon.name}'s Flash Fire neutralized the attack!`);
                            effectiveness = 0;
                        }
                    }

                    // Weather damage modifiers
                    let weatherMod = 1;
                    if (state.weather === 'Sun') { if (move.type === 'Fire') weatherMod = 1.5; if (move.type === 'Water') weatherMod = 0.5; }
                    if (state.weather === 'Rain') { if (move.type === 'Water') weatherMod = 1.5; if (move.type === 'Fire') weatherMod = 0.5; }

                    // Multi-hit
                    let hits = 1;
                    if (move.effects && move.effects.multiHit) {
                        const [lo, hi] = move.effects.multiHit;
                        if (lo === hi) hits = lo;
                        else hits = lo + Math.floor(Math.random() * (hi - lo + 1));
                    }

                    let totalDmg = 0;
                    for (let h = 0; h < hits; h++) {
                        if (defMon.currentHp <= 0) break;

                        let damage = Math.floor((((2 * level / 5 + 2) * move.power * statA / statD) / 50) + 2);
                        const isSTAB = mon.types.includes(move.type) ? 1.5 : 1;
                        if (isCrit) damage = Math.floor(damage * 1.5);
                        const rng = (85 + Math.random() * 15) / 100;
                        damage = Math.floor(damage * isSTAB * effectiveness * rng * isLifeOrb * weatherMod);

                        // Semi-invulnerable bypass bonus (e.g. Earthquake vs Dig)
                        if (doubleDamageInvulnerable) damage *= 2;

                        if (effectiveness > 1 && h === 0) log.push(`> It's <span class="super">super effective!</span>`);
                        if (effectiveness < 1 && effectiveness > 0 && h === 0) log.push(`> It's <span class="notvery">not very effective...</span>`);
                        if (effectiveness === 0) { log.push(`> It had <span class="notvery">no effect</span> on ${defMon.name}!`); damage = 0; break; }
                        if (isCrit && damage > 0) log.push(`> <span class="crit">A critical hit!</span>`);

                        // --- PRE-DAMAGE FORM ABILITIES ---
                        // Disguise: Mimikyu negates first hit
                        if (damage > 0 && defMon.ability === 'Disguise' && !defMon.disguiseBroken) {
                            defMon.disguiseBroken = true;
                            const selfDmg = Math.floor(defMon.hp / 8);
                            defMon.currentHp = Math.max(0, defMon.currentHp - selfDmg);
                            morphToForm(defMon, 'mimikyubusted');
                            log.push(`> <span style="color:var(--accent)">${defMon.name}'s Disguise was busted!</span>`);
                            damage = 0;
                        }
                        // Ice Face: Eiscue blocks first physical hit
                        if (damage > 0 && defMon.ability === 'Ice Face' && !defMon.iceFaceBroken && move.category === 'Physical') {
                            defMon.iceFaceBroken = true;
                            morphToForm(defMon, 'eiscuenoice');
                            log.push(`> <span style="color:var(--accent)">${defMon.name}'s Ice Face blocked the attack!</span>`);
                            damage = 0;
                        }

                        if (damage > 0) {
                            const bypassesSub = (move.effects && (move.effects.sound || move.effects.bypassesSubstitute)) || mon.ability === 'Infiltrator';
                            if (defMon.substituteHp > 0 && !bypassesSub) {
                                defMon.substituteHp -= damage;
                                log.push(`> The substitute took damage for ${defMon.name}!`);
                                if (defMon.substituteHp <= 0) {
                                    log.push(`> ${defMon.name}'s substitute faded!`);
                                    defMon.substituteHp = 0;
                                }
                            } else {
                                let dmgDealt = Math.min(defMon.currentHp, damage);
                                if (defMon.item === 'Focus Sash' && defMon.currentHp === defMon.hp && damage >= defMon.currentHp) {
                                    defMon.currentHp = 1; defMon.item = 'None';
                                    log.push(`<span class="item-text">${defMon.name} hung on using its Focus Sash!</span>`);
                                } else { defMon.currentHp = Math.max(0, defMon.currentHp - damage); }
                                totalDmg += dmgDealt;
                                if (defMon.currentHp === 0) log.push(`<span class="fainted-text">${defMon.name} fainted!</span>`);

                                // Destiny Bond
                                if (defMon.currentHp === 0 && defMon.destinyBond) {
                                    mon.currentHp = 0;
                                    log.push(`> ${mon.name} took its attacker down with it!`);
                                }

                                // Rocky Helmet
                                if (defMon.item === 'Rocky Helmet' && move.category === 'Physical' && defMon.currentHp > 0) { // simplified contact check
                                    const recoil = Math.floor(mon.hp / 6);
                                    mon.currentHp = Math.max(0, mon.currentHp - recoil);
                                    log.push(`> ${mon.name} was hurt by ${defMon.name}'s Rocky Helmet!`);
                                }
                                // Air balloon pop
                                if (defMon.item === 'Air Balloon') {
                                    log.push(`> ${defMon.name}'s Air Balloon popped!`);
                                    defMon.item = null;
                                }
                            }
                        }
                    }
                    if (hits > 1) log.push(`> Hit ${hits} time(s)!`);

                    // Life Orb recoil
                    if (mon.item === 'Life Orb' && mon.currentHp > 0 && totalDmg > 0) {
                        const recoil = Math.floor(mon.hp / 10) || 1;
                        mon.currentHp = Math.max(0, mon.currentHp - recoil);
                        log.push(`<span class="item-text">${mon.name} lost some HP due to Life Orb!</span>`);
                        if (mon.currentHp === 0) log.push(`<span class="fainted-text">${mon.name} fainted!</span>`);
                    }

                    // Move effects after damage
                    if (move.effects && totalDmg > 0) {
                        const fx = { ...move.effects };

                        // Sheer Force negates secondary effects applied to the target or user from attacking moves
                        if (mon.ability === 'Sheer Force' && (fx.status || fx.enemyDrop || fx.flinch)) {
                            delete fx.status;
                            delete fx.enemyDrop;
                            delete fx.flinch;
                            // selfBoost is kept only if the move is explicitly a boosting move, but Sheer Force typically negates Power-Up Punch style boosts too. For simplicity, we'll negate secondary selfBoosts but keep primary modifiers untouched.
                            if (!fx.recharge && !fx.twoTurn) delete fx.selfBoost;
                        }

                        if (fx.recharge) mon.recharging = true;
                        if (fx.recoilPerc && mon.currentHp > 0) {
                            const r = Math.floor(totalDmg * fx.recoilPerc) || 1;
                            mon.currentHp = Math.max(0, mon.currentHp - r);
                            log.push(`<span class="item-text">${mon.name} is damaged by recoil!</span>`);
                            if (mon.currentHp === 0) log.push(`<span class="fainted-text">${mon.name} fainted!</span>`);
                        }
                        if (fx.drainPerc && mon.currentHp > 0) {
                            const h2 = Math.floor(totalDmg * fx.drainPerc) || 1;
                            mon.currentHp = Math.min(mon.hp, mon.currentHp + h2);
                            log.push(`<span class="item-text">${mon.name} had its energy drained!</span>`);
                        }
                        if (fx.enemyDrop && defMon.currentHp > 0 && Math.random() * 100 < (fx.dropRate || 100)) {
                            for (const [s, amt] of Object.entries(fx.enemyDrop)) {
                                defMon.boosts[s] = Math.max(-6, Math.min(6, defMon.boosts[s] + amt));
                                log.push(`<span class="notvery">${defMon.name}'s ${s} fell!</span>`);
                            }
                        }
                        if (fx.selfBoost && mon.currentHp > 0 && Math.random() * 100 < (fx.boostRate || 100)) {
                            for (const [s, amt] of Object.entries(fx.selfBoost)) {
                                mon.boosts[s] = Math.max(-6, Math.min(6, mon.boosts[s] + amt));
                                log.push(`<span class="super">${mon.name}'s ${s} rose!</span>`);
                            }
                        }
                    }
                }

                // --- STATUS & NON-DAMAGING MOVE EFFECTS ---
                if (move.category === 'Status' || (move.effects && defMon.currentHp > 0)) {
                    const fx = move.effects;

                    // Substitute block status & drops
                    const bypassesSubStatus = (fx && (fx.sound || fx.bypassesSubstitute)) || mon.ability === 'Infiltrator' || (fx && (fx.clearHazards || fx.haze));
                    const subBlocks = defMon.substituteHp > 0 && !bypassesSubStatus;

                    if (fx) {
                        if (fx.selfBoost && mon.currentHp > 0 && Math.random() * 100 < (fx.boostRate || 100)) {
                            for (const [s, amt] of Object.entries(fx.selfBoost)) {
                                mon.boosts[s] = Math.max(-6, Math.min(6, mon.boosts[s] + amt));
                                log.push(`<span class="super">${mon.name}'s ${s} rose!</span>`);
                            }
                        }
                        if (fx.selfDrop && mon.currentHp > 0) {
                            for (const [s, amt] of Object.entries(fx.selfDrop)) {
                                mon.boosts[s] = Math.max(-6, Math.min(6, mon.boosts[s] + amt));
                                log.push(`<span class="notvery">${mon.name}'s ${s} fell!</span>`);
                            }
                        }
                        if (fx.enemyDrop && defMon.currentHp > 0 && move.category === 'Status' && Math.random() * 100 < (fx.dropRate || 100) && !subBlocks) {
                            for (const [s, amt] of Object.entries(fx.enemyDrop)) {
                                defMon.boosts[s] = Math.max(-6, Math.min(6, defMon.boosts[s] + amt));
                                log.push(`<span class="notvery">${defMon.name}'s ${s} fell!</span>`);
                            }
                        }
                        if (fx.healPerc && mon.currentHp > 0) {
                            const heal = Math.floor(mon.hp * fx.healPerc);
                            mon.currentHp = Math.min(mon.hp, mon.currentHp + heal);
                            log.push(`<span class="item-text">${mon.name} recovered HP!</span>`);
                        }
                        // Status
                        if (fx.status && defMon.currentHp > 0 && !defMon.status && Math.random() * 100 < (fx.statusRate || 100) && !subBlocks) {
                            let canApply = true;
                            if (fx.status === 'SLP' && state.format.clauses?.includes('Sleep Clause Mod')) {
                                if (teams[defUid].some(p => p.status === 'SLP')) { canApply = false; log.push(`> Sleep Clause Mod blocked!`); }
                            }
                            if (fx.status === 'PAR' && defMon.types.includes('Electric')) canApply = false;
                            if (fx.status === 'PAR' && move.name === 'Thunder Wave' && defMon.types.includes('Ground')) {
                                canApply = false;
                                log.push(`> It doesn't affect ${defMon.name}...`);
                            }
                            if (fx.status === 'BRN' && defMon.types.includes('Fire')) canApply = false;
                            if ((fx.status === 'PSN' || fx.status === 'TOX') && (defMon.types.includes('Poison') || defMon.types.includes('Steel'))) canApply = false;
                            if (fx.status === 'FRZ' && defMon.types.includes('Ice')) canApply = false;

                            // Powder/Spore moves vs Grass
                            if (fx.powder && defMon.types.includes('Grass')) {
                                canApply = false;
                                log.push(`> It doesn't affect ${defMon.name}...`);
                            }
                            // Prankster vs Dark
                            if (mon.ability === 'Prankster' && move.category === 'Status' && defMon.types.includes('Dark')) {
                                canApply = false;
                                log.push(`> It doesn't affect ${defMon.name}...`);
                            }

                            if (canApply) {
                                defMon.status = fx.status;
                                if (fx.status === 'TOX') defMon.toxicCounter = 1;
                                if (fx.status === 'SLP') defMon.sleepTurns = 1 + Math.floor(Math.random() * 3);
                                log.push(`<span class="status-${fx.status}">${defMon.name} was afflicted with ${fx.status}!</span>`);
                            }
                        }
                        if (fx.weather) {
                            state.weather = fx.weather;
                            state.weatherTurns = 5;
                            const wNames = { Sun: 'harsh sunlight', Rain: 'rain', Sand: 'a sandstorm', Snow: 'a snowstorm' };
                            log.push(`> The weather changed to ${wNames[state.weather]}!`);
                        }
                        if (fx.hazards) {
                            const h = fx.hazards;
                            if (!state.hazards[defUid]) state.hazards[defUid] = {};
                            if (h === 'stealth-rock' || h === 'sticky-web') {
                                if (!state.hazards[defUid][h]) {
                                    state.hazards[defUid][h] = 1;
                                    log.push(`> ${h.replace('-', ' ')} was set around ${roomState.players[defUid].name}'s team!`);
                                }
                            } else if (h === 'spikes') {
                                state.hazards[defUid][h] = Math.min(3, (state.hazards[defUid][h] || 0) + 1);
                                log.push(`> Spikes were scattered all around the feet of ${roomState.players[defUid].name}'s team!`);
                            } else if (h === 'toxic-spikes') {
                                state.hazards[defUid][h] = Math.min(2, (state.hazards[defUid][h] || 0) + 1);
                                log.push(`> Poison darts were scattered all around the feet of ${roomState.players[defUid].name}'s team!`);
                            }
                        }
                        if (fx.clearHazards) {
                            state.hazards[uid] = {};
                            state.hazards[defUid] = {};
                            state.screens[uid] = {};
                            state.screens[defUid] = {};
                            log.push(`> The entry hazards and screens were cleared from the field!`);
                        }
                        if (fx.clearMyHazards) {
                            state.hazards[uid] = {};
                            log.push(`> ${mon.name} blew away the hazards!`);
                        }
                        if (fx.screen) {
                            const turns = mon.item === 'Light Clay' ? 8 : 5;
                            if (fx.screen === 'aurora-veil' && state.weather !== 'Snow') {
                                log.push(`> But it failed! (Aurora Veil requires Snow)`);
                            } else {
                                state.screens[uid][fx.screen] = turns;
                                log.push(`> ${move.name} raised ${roomState.players[uid].name}'s team defenses!`);
                            }
                        }
                        if (fx.substitute) {
                            if (mon.currentHp > mon.hp / 4) {
                                const cost = Math.floor(mon.hp / 4);
                                mon.currentHp -= cost;
                                mon.substituteHp = cost;
                                log.push(`> ${mon.name} created a Substitute!`);
                            } else {
                                log.push(`> But it failed! ${mon.name} is too weak to make a substitute!`);
                            }
                        }
                        if (fx.leechSeed && !defMon.types.includes('Grass') && !subBlocks) {
                            defMon.seeded = true;
                            log.push(`> ${defMon.name} was seeded!`);
                        }
                        if (fx.taunt && !subBlocks) {
                            defMon.taunt = fx.taunt;
                            log.push(`> ${defMon.name} fell for the taunt!`);
                        }
                        if (fx.encore && !subBlocks && state.actions[defUid]?.type === 'move') {
                            defMon.encore = fx.encore;
                            log.push(`> ${defMon.name} received an encore!`);
                        }
                        if (fx.trick && !subBlocks) {
                            const tmp = mon.item;
                            mon.item = defMon.item;
                            defMon.item = tmp;
                            log.push(`> ${mon.name} swapped items with its target!`);
                        }
                        if (fx.haze) {
                            mon.boosts = { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, accuracy: 0, evasion: 0 };
                            defMon.boosts = { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, accuracy: 0, evasion: 0 };
                            log.push(`> All stat changes were eliminated!`);
                        }
                        if (fx.hazeTarget && !subBlocks) {
                            defMon.boosts = { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, accuracy: 0, evasion: 0 };
                            log.push(`> ${defMon.name}'s stat changes were eliminated!`);
                        }
                        if (fx.curse && !subBlocks) {
                            if (mon.types.includes('Ghost')) {
                                mon.currentHp = Math.max(0, mon.currentHp - Math.floor(mon.hp / 2));
                                defMon.cursed = true;
                                log.push(`> ${mon.name} cut its own HP and laid a curse on ${defMon.name}!`);
                            } else {
                                mon.boosts.spe = Math.max(-6, mon.boosts.spe - 1);
                                mon.boosts.atk = Math.min(6, mon.boosts.atk + 1);
                                mon.boosts.def = Math.min(6, mon.boosts.def + 1);
                                log.push(`> ${mon.name}'s Speed fell! Its Attack and Defense rose!`);
                            }
                        }
                        if (fx.destinyBond) {
                            mon.destinyBond = true;
                            log.push(`> ${mon.name} is hoping to take its attacker down with it!`);
                        }
                        if (fx.perishSong) {
                            mon.perishSong = 4;
                            defMon.perishSong = 4;
                            log.push(`> All Pokémon hearing the song will faint in 3 turns!`);
                        }
                        if (fx.wish) {
                            state.wish = state.wish || {};
                            state.wish[uid] = { hp: Math.floor(mon.hp / 2) };
