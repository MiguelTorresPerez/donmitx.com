<html lang="en">

<head>

    <style>
        :root {
            --bg: #0a0e1a;
            --card: #141929;
            --card-hover: #1c2238;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.15);
            --error: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.15);
            --text: #f1f5f9;
            --text-muted: #64748b;
            --gold: #f59e0b;
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-wrapper {
            width: 100%;
            max-width: 560px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        /* --- Setup Screen --- */
        .setup-card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 32px;
            text-align: center;
        }

        .setup-card h2 {
            margin-bottom: 20px;
        }

        .player-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .player-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-row .color-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .player-row input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .player-row input::placeholder {
            color: var(--text-muted);
        }

        .btn-add-player {
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            color: var(--text-muted);
            padding: 10px;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-add-player:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .setup-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }

        .btn-primary:hover {
            background: #4f46e5;
            transform: scale(1.02);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: default;
            transform: none;
        }

        /* --- Scoreboard --- */
        .scoreboard {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .score-chip {
            flex: 1;
            min-width: 80px;
            background: var(--card);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .score-chip.active {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .score-chip .player-name {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-chip .player-score {
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 2px;
        }

        .score-chip .player-streak {
            font-size: 0.65rem;
            color: var(--gold);
            margin-top: 1px;
        }

        /* --- Turn Indicator --- */
        .turn-indicator {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.15));
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 10px;
            padding: 8px 16px;
            text-align: center;
            margin-bottom: 16px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* --- Progress --- */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #a855f7);
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        /* --- Category Badge --- */
        .category-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 16px;
        }

        .cat-science {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .cat-history {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .cat-geography {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .cat-entertainment {
            background: rgba(236, 72, 153, 0.2);
            color: #f472b6;
        }

        .cat-sports {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .cat-tech {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
        }

        .cat-nature {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .cat-food {
            background: rgba(251, 146, 60, 0.2);
            color: #fb923c;
        }

        /* --- Question Card --- */
        .question-card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text);
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateX(4px);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct {
            background: var(--success-bg);
            border-color: var(--success);
            color: var(--success);
        }

        .option-btn.wrong {
            background: var(--error-bg);
            border-color: var(--error);
            color: var(--error);
        }

        .feedback-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            min-height: 40px;
        }

        .feedback-text {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .feedback-text.correct {
            color: var(--success);
        }

        .feedback-text.wrong {
            color: var(--error);
        }

        .btn-next {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-next:hover {
            background: #4f46e5;
            transform: scale(1.03);
        }

        /* --- End Screen --- */
        .end-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .podium {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 28px;
            align-items: flex-end;
        }

        .podium-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .podium-bar {
            width: 80px;
            border-radius: 12px 12px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 12px 8px;
            color: white;
            font-weight: 700;
        }

        .podium-bar .rank {
            font-size: 1.5rem;
        }

        .podium-bar .pts {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 4px;
        }

        .podium-name {
            margin-top: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .end-screen .btn-primary {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: slideIn 0.35s ease forwards;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        .shake {
            animation: shake 0.4s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }

            100% {
                transform: scale(1);
            }
        }

        .pop {
            animation: pop 0.3s ease;
        }
    </style>
</head>

            { q: "What is the largest organ in the human body?", a: ["Skin", "Liver", "Heart", "Lungs"], c: 0, cat: "nature" },
            { q: "Diamonds are made of which element?", a: ["Carbon", "Silicon", "Iron", "Calcium"], c: 0, cat: "nature" },
            { q: "What is the only mammal capable of true flight?", a: ["Bat", "Flying Squirrel", "Sugar Glider", "Colugo"], c: 0, cat: "nature" },
            { q: "How many teeth does an adult human typically have?", a: ["32", "28", "30", "36"], c: 0, cat: "nature" },
            // ── Food & Culture (12) ──
            { q: "What country is the origin of sushi?", a: ["Japan", "China", "Korea", "Thailand"], c: 0, cat: "food" },
            { q: "What is the main ingredient in hummus?", a: ["Chickpeas", "Lentils", "Black Beans", "Peas"], c: 0, cat: "food" },
            { q: "Champagne comes from which country?", a: ["France", "Italy", "Spain", "Germany"], c: 0, cat: "food" },
            { q: "What spice gives curry its yellow color?", a: ["Turmeric", "Saffron", "Paprika", "Cumin"], c: 0, cat: "food" },
            { q: "What Italian city is famous for its pizza?", a: ["Naples", "Rome", "Milan", "Florence"], c: 0, cat: "food" },
            { q: "What fruit is known as the 'king of fruits'?", a: ["Durian", "Mango", "Jackfruit", "Pineapple"], c: 0, cat: "food" },
            { q: "Kimchi originated in which country?", a: ["Korea", "Japan", "China", "Vietnam"], c: 0, cat: "food" },
            { q: "What nut is used to make marzipan?", a: ["Almond", "Cashew", "Walnut", "Pistachio"], c: 0, cat: "food" },
            { q: "Sake is a traditional drink from which country?", a: ["Japan", "China", "Korea", "Thailand"], c: 0, cat: "food" },
            { q: "What grain is used to make traditional Italian risotto?", a: ["Arborio Rice", "Basmati Rice", "Wheat", "Barley"], c: 0, cat: "food" },
            { q: "Brie and Camembert are types of what?", a: ["Cheese", "Bread", "Pastry", "Wine"], c: 0, cat: "food" },
            { q: "What bean is chocolate made from?", a: ["Cacao", "Coffee", "Vanilla", "Carob"], c: 0, cat: "food" },
        ];

        // ═══════════════════════════════════════════════════
        //  GAME ENGINE
        // ═══════════════════════════════════════════════════

        const PLAYER_COLORS = ['#6366f1', '#ec4899', '#10b981', '#f59e0b', '#ef4444', '#06b6d4'];
        const QUESTIONS_PER_PLAYER = 5;
        const $area = document.getElementById('game-area');

        let players = [];
        let questions = [];
        let currentQIdx = 0;
        let currentPlayerIdx = 0;

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ═══════════════════════════════════════════════════
        //  SETUP SCREEN
        // ═══════════════════════════════════════════════════

        function showSetup() {
            $area.innerHTML = `
        <div class="setup-card animate-in">
            <h2>👥 Player Setup</h2>
            <p style="color:var(--text-muted); margin-bottom:20px; font-size:0.85rem;">Enter 2–6 player names to start</p>
            <div class="player-inputs" id="player-inputs">
                <div class="player-row">
                    <div class="color-dot" style="background:${PLAYER_COLORS[0]}"></div>
                    <input type="text" placeholder="Player 1" maxlength="16" autofocus>
                </div>
                <div class="player-row">
                    <div class="color-dot" style="background:${PLAYER_COLORS[1]}"></div>
                    <input type="text" placeholder="Player 2" maxlength="16">
                </div>
            </div>
            <button class="btn-add-player" id="btn-add">+ Add Player</button>
            <div class="setup-actions">
                <button class="btn-primary" id="btn-start">Start Game 🚀</button>
            </div>
        </div>
    `;

            const addBtn = document.getElementById('btn-add');
            const container = document.getElementById('player-inputs');
            addBtn.onclick = () => {
                const count = container.children.length;
                if (count >= 6) return;
                const row = document.createElement('div');
                row.className = 'player-row';
                row.innerHTML = `
            <div class="color-dot" style="background:${PLAYER_COLORS[count]}"></div>
            <input type="text" placeholder="Player ${count + 1}" maxlength="16">
        `;
                container.appendChild(row);
                if (count + 1 >= 6) addBtn.style.display = 'none';
            };

            document.getElementById('btn-start').onclick = () => {
                const inputs = container.querySelectorAll('input');
                players = [];
                inputs.forEach((inp, i) => {
                    const name = inp.value.trim() || `Player ${i + 1}`;
                    players.push({ name, color: PLAYER_COLORS[i], score: 0, streak: 0, bestStreak: 0, correct: 0 });
                });
                if (players.length < 2) return alert('Need at least 2 players!');
                startGame();
            };
        }

        // ═══════════════════════════════════════════════════
        //  GAME LOOP
        // ═══════════════════════════════════════════════════

        function startGame() {
            const totalQ = players.length * QUESTIONS_PER_PLAYER;
            questions = shuffle([...ALL_QUESTIONS]).slice(0, totalQ);
            questions.forEach(q => {
                const correct = q.a[q.c];
                shuffle(q.a);
                q.c = q.a.indexOf(correct);
            });
            currentQIdx = 0;
            currentPlayerIdx = 0;
            renderQuestion();
        }

        function renderQuestion() {
            if (currentQIdx >= questions.length) return showResults();

            const q = questions[currentQIdx];
            const player = players[currentPlayerIdx];
            const total = questions.length;

            $area.innerHTML = `
        <div class="scoreboard" id="scoreboard">
            ${players.map((p, i) => `
                <div class="score-chip ${i === currentPlayerIdx ? 'active' : ''}" style="${i === currentPlayerIdx ? `border-color:${p.color}; box-shadow:0 0 12px ${p.color}40` : ''}">
                    <div class="player-name" style="color:${p.color}">${esc(p.name)}</div>
                    <div class="player-score">${p.score}</div>
                    <div class="player-streak">${p.streak > 0 ? '🔥' + p.streak : ''}</div>
                </div>
            `).join('')}
        </div>
        <div class="turn-indicator" style="border-color:${player.color}40; background:linear-gradient(135deg, ${player.color}15, ${player.color}08);">
            <span style="color:${player.color}">${esc(player.name)}</span>'s turn — Question ${currentQIdx + 1}/${total}
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${(currentQIdx / total) * 100}%"></div></div>
        <div class="question-card animate-in" id="q-card">
            <span class="category-badge cat-${q.cat}">${q.cat}</span>
            <div class="question-text">${esc(q.q)}</div>
            <div class="options" id="options">
                ${q.a.map((a, i) => `<button class="option-btn" data-i="${i}">${esc(a)}</button>`).join('')}
            </div>
            <div class="feedback-row">
                <span class="feedback-text" id="feedback"></span>
                <button class="btn-next" id="btn-next" style="display:none">Next →</button>
            </div>
        </div>
    `;

            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.onclick = () => handleAnswer(parseInt(btn.dataset.i));
            });
            document.getElementById('btn-next').onclick = () => {
                currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
                currentQIdx++;
                renderQuestion();
            };
        }

        function handleAnswer(idx) {
            const q = questions[currentQIdx];
            const player = players[currentPlayerIdx];
            const btns = document.querySelectorAll('.option-btn');
            const fb = document.getElementById('feedback');

            btns.forEach(b => b.disabled = true);

            if (idx === q.c) {
                btns[idx].classList.add('correct');
                player.streak++;
                player.correct++;
                if (player.streak > player.bestStreak) player.bestStreak = player.streak;
                const pts = 10 + (player.streak > 1 ? player.streak * 2 : 0);
                player.score += pts;
                fb.textContent = player.streak > 1 ? `🔥 Correct! +${pts} (${player.streak}x streak!)` : `✅ Correct! +${pts}`;
                fb.className = 'feedback-text correct';
                document.getElementById('q-card').classList.add('pop');
            } else {
                btns[idx].classList.add('wrong');
                btns[q.c].classList.add('correct');
                player.streak = 0;
                fb.textContent = '❌ Wrong!';
                fb.className = 'feedback-text wrong';
                document.getElementById('q-card').classList.add('shake');
            }

            // Update scoreboard live
            const chips = document.querySelectorAll('.score-chip');
            chips[currentPlayerIdx].querySelector('.player-score').textContent = player.score;
            chips[currentPlayerIdx].querySelector('.player-streak').textContent = player.streak > 0 ? '🔥' + player.streak : '';

            document.getElementById('btn-next').style.display = 'inline-flex';
        }

        // ═══════════════════════════════════════════════════
        //  RESULTS SCREEN (PODIUM)
        // ═══════════════════════════════════════════════════

        function showResults() {
            const sorted = [...players].sort((a, b) => b.score - a.score);
            const maxScore = sorted[0].score || 1;
            const podiumColors = ['#f59e0b', '#94a3b8', '#b45309'];

            const podiumHtml = sorted.slice(0, 3).map((p, i) => {
                const height = Math.max(60, (p.score / maxScore) * 160);
                return `
            <div class="podium-slot">
                <div class="podium-bar" style="height:${height}px; background:${podiumColors[i] || p.color};">
                    <div class="rank">${i === 0 ? '🏆' : i === 1 ? '🥈' : '🥉'}</div>
                    <div class="pts">${p.score} pts</div>
                </div>
                <div class="podium-name" style="color:${p.color}">${esc(p.name)}</div>
            </div>
        `;
            }).join('');

            const statsHtml = sorted.map((p, i) => `
        <tr>
            <td style="color:${p.color}; font-weight:600;">${i + 1}. ${esc(p.name)}</td>
            <td>${p.score}</td>
            <td>${p.correct}/${QUESTIONS_PER_PLAYER}</td>
            <td>🔥 ${p.bestStreak}</td>
        </tr>
    `).join('');

            $area.innerHTML = `
        <div class="end-screen animate-in">
            <h2 style="margin-bottom:24px;">🏆 ${esc(sorted[0].name)} Wins!</h2>
            <div class="podium">${podiumHtml}</div>
            <table style="width:100%;text-align:left;border-collapse:collapse;margin-bottom:24px;">
                <thead><tr style="color:var(--text-muted);font-size:0.75rem;text-transform:uppercase;">
                    <th style="padding:6px 0;">Player</th><th>Score</th><th>Correct</th><th>Streak</th>
                </tr></thead>
                <tbody style="font-size:0.9rem;">${statsHtml}</tbody>
            </table>
            <button class="btn-primary" onclick="showSetup()">Play Again 🔄</button>
        </div>
    `;
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        // Start!
        showSetup();
    </script>
</body>

</html>
