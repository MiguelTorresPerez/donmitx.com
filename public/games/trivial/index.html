<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivial Mini-Game</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .game-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: var(--primary);
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .question {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) {
            background: var(--primary);
            border-color: var(--primary);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        button.correct {
            background: var(--success);
            border-color: var(--success);
        }

        button.wrong {
            background: var(--error);
            border-color: var(--error);
        }

        .feedback {
            margin-top: 20px;
            font-weight: bold;
            min-height: 24px;
        }

        .btn-next {
            margin-top: 20px;
            background: var(--primary);
            display: none;
            width: 100%;
        }

        .btn-next:hover {
            background: var(--primary-hover);
        }
    </style>
</head>

<body>

    <div class="game-container">
        <h1>🤓 Trivial</h1>
        <div class="score-board">
            <span>Score: <span id="score">0</span></span>
            <span>Question <span id="q-num">1</span>/5</span>
        </div>

        <div id="game-area">
            <div class="question" id="question">Loading...</div>
            <div class="options" id="options"></div>
            <div class="feedback" id="feedback"></div>
            <button class="btn-next" id="btn-next">Next Question</button>
        </div>
    </div>

    <script>
        const questions = [
            { q: "What is the capital of France?", a: ["Berlin", "Madrid", "Paris", "Rome"], correct: 2 },
            { q: "Which planet is known as the Red Planet?", a: ["Venus", "Mars", "Jupiter", "Saturn"], correct: 1 },
            { q: "What is the largest ocean on Earth?", a: ["Atlantic", "Indian", "Arctic", "Pacific"], correct: 3 },
            { q: "Who wrote 'Hamlet'?", a: ["Charles Dickens", "William Shakespeare", "Mark Twain", "Jane Austen"], correct: 1 },
            { q: "What is the square root of 64?", a: ["6", "7", "8", "9"], correct: 2 }
        ];

        let currentQ = 0;
        let score = 0;

        const qEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const btnNext = document.getElementById('btn-next');
        const scoreEl = document.getElementById('score');
        const qNumEl = document.getElementById('q-num');

        function loadQuestion() {
            if (currentQ >= questions.length) {
                qEl.textContent = "Game Over!";
                optionsEl.innerHTML = `You scored ${score} out of ${questions.length}!`;
                feedbackEl.textContent = "";
                btnNext.textContent = "Play Again";
                btnNext.style.display = "block";
                btnNext.onclick = () => location.reload();
                return;
            }

            const q = questions[currentQ];
            qEl.textContent = q.q;
            optionsEl.innerHTML = '';
            feedbackEl.textContent = '';
            btnNext.style.display = 'none';
            qNumEl.textContent = currentQ + 1;

            q.a.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsEl.appendChild(btn);
            });
        }

        function checkAnswer(index, btn) {
            const q = questions[currentQ];
            const buttons = optionsEl.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);

            if (index === q.correct) {
                btn.classList.add('correct');
                feedbackEl.textContent = "Correct! 🎉";
                feedbackEl.style.color = "var(--success)";
                score += 10;
                scoreEl.textContent = score;
            } else {
                btn.classList.add('wrong');
                buttons[q.correct].classList.add('correct');
                feedbackEl.textContent = "Wrong! ❌";
                feedbackEl.style.color = "var(--error)";
            }

            currentQ++;
            btnNext.style.display = 'block';
        }

        btnNext.onclick = loadQuestion;

        // Start
        loadQuestion();
    </script>
</body>

</html>
